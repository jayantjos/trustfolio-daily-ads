name: Select real Croma catalog SKU for Cloudflare cross-check
on:
  push:
    branches: [diagnostics/croma-direct-live-price-20261027]
    paths: [.github/workflows/catalog-quality-audit.yml]
permissions:
  contents: read
jobs:
  read-only-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check audit syntax
        run: node --check ops/price-worker-diagnostics/select_croma_verified_sku.cjs
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test "$HOST" = '200.234.47.87'
          test "$USER" = 'scraperuser'
          test -n "$HOSTKEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
      - name: Read-only POCO variant Mongo and Worker diagnostics
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes ops/price-worker-diagnostics/select_croma_verified_sku.cjs "$USER@$HOST:~/select_croma_verified_sku.cjs"
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes "$USER@$HOST" 'cd "$HOME/apps/trustfolio/node-backend" && node "$HOME/select_croma_verified_sku.cjs"'
