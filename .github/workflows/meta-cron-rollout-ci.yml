name: TrustFolio direct Meta daily rollout safety CI
on:
  pull_request:
    paths:
      - '.github/workflows/auto-instagram-campaigns.yml'
      - '.github/workflows/meta-readonly-connection.yml'
      - '.github/workflows/meta-cron-rollout-ci.yml'
      - 'automation/validate_live_price_before_publish_v1.py'
      - 'automation/test_live_price_before_publish_v1.py'
      - 'automation/verify_price_before_meta_publish_v1.py'
      - 'automation/test_verify_price_before_meta_publish_v1.py'
  push:
    branches: [feature/activate-meta-direct-daily-from-20261026]
    paths:
      - '.github/workflows/auto-instagram-campaigns.yml'
      - '.github/workflows/meta-readonly-connection.yml'
      - '.github/workflows/meta-cron-rollout-ci.yml'
permissions:
  contents: read
jobs:
  validate-safe-meta-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal workflow syntax parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Test five-product website live-price recheck fail-closed
        run: |
          python -m py_compile automation/validate_live_price_before_publish_v1.py automation/verify_price_before_meta_publish_v1.py
          python -m unittest -v automation.test_live_price_before_publish_v1 automation.test_verify_price_before_meta_publish_v1
      - name: Assert Oct 21 crosspost IG+FB, and zero push/PR publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          flow_path=Path('.github/workflows/auto-instagram-campaigns.yml')
          data=yaml.load(flow_path.read_text('utf8'),Loader=yaml.BaseLoader)
          assert data['on']['schedule']==[
              {'cron':'0 3 * * *'},{'cron':'0 5 * * *'},
              {'cron':'0 8 * * *'},{'cron':'30 10 * * *'},
              {'cron':'30 13 * * *'},{'cron':'30 15 * * *'}]
          job=data['jobs']['render-qa-schedule']
          env=job['env']
          assert "vars.TF_META_DIRECT_PUBLISH_ENABLED" in env['TF_META_DIRECT_PUBLISH_ENABLED']
          assert "'true'" in env['TF_META_DIRECT_PUBLISH_ENABLED']
          assert "'false'" in env['TF_AUTO_POST_ENABLED']
          assert env['TF_META_MAX_POSTS_PER_DAY_PER_NETWORK']=='3'
          assert "'2026-10-21'" in env['TF_META_START_DATE']
          publisher=[s for s in job['steps'] if s.get('name','').startswith('Publish to verified Instagram and Facebook')]
          assert len(publisher)==1
          publish=publisher[0]
          cond=publish['if']
          assert "github.event_name == 'schedule'" in cond
          planner=next(s for s in job['steps'] if s.get('id')=='plan')
          assert "'0 5 * * *':('budget',0)" in planner['run']
          assert "'30 10 * * *':('brand_budget',0)" in planner['run']
          assert "'30 15 * * *':('comparison',0)" in planner['run']
          assert any(s.get('id')=='already_done' for s in job['steps'] )
          for cron in ('0 3 * * *','0 5 * * *','0 8 * * *',
                       '30 10 * * *','30 13 * * *','30 15 * * *'):
              assert "github.event.schedule == '"+cron+"'" in cond
          assert "workflow_dispatch" not in cond
          assert 'if [[ "$today_ist" < "2026-10-21" ]]' in publish['run']
          assert 'exit 0' in publish['run']
          assert 'export TF_META_POST_NETWORKS=instagram,facebook' in publish['run']
          assert 'export TF_META_START_DATE=2026-10-21' in publish['run']
          assert 'export TF_META_POST_NETWORKS=facebook\n' not in publish['run']
          assert 'FACEBOOK_ONLY' not in publish['run']
          assert "today_ist" in publish['run']
          assert "automation/verify_price_before_meta_publish_v1.py" in publish['run']
          assert "automation/validate_live_price_before_publish_v1.py" not in publish['run']
          assert publish['run'].index("automation/verify_price_before_meta_publish_v1.py") < publish['run'].index("automation/meta_graph_publish_v1.py")
          assert '--plan campaign/plan.json' in publish['run']
          assert '--report campaign/website-top5-render-qa.json' in publish['run']
          assert '--manifest campaign/post/post.json' in publish['run']
          assert 'secrets.TF_META_PAGE_ACCESS_TOKEN' in publish['env']['TF_META_PAGE_ACCESS_TOKEN']
          health=yaml.load(Path('.github/workflows/meta-readonly-connection.yml').read_text('utf8'),Loader=yaml.BaseLoader)
          assert health['on']['schedule']==[{'cron':'10 2 * * *'}]
          src=Path('automation/meta_readonly_preflight.py').read_text('utf8')
          assert 'publish_verified(' not in src
          assert 'confirm_page_token_type(' in src
          print('DIRECT_META_THREE_PUBLISHED_MODES_PER_NETWORK_WITH_RECOVERY_SLOTS')
          print('DIRECT_META_INSTAGRAM_AND_FACEBOOK_FROM_2026_10_21')
          print('DIRECT_META_FIVE_PRODUCT_LIVE_PRICE_RECHECK_REQUIRED')
          print('DIRECT_META_PUSH_AND_PR_POSTS_DISABLED')
          print('METRICOOL_UNATTENDED_POSTS_OFF')
          print('DAILY_TOKEN_READ_ONLY_HEALTH_CHECK_ON')
          PY
