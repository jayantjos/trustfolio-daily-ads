name: Inspect website restart tests and rollback before live change
on:
  push:
    branches: [fix/site-budget-after-live-price-20261018]
    paths: [.github/workflows/inspect-site-runtime-20261018.yml]
permissions: { contents: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure pinned SSH
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" && -n "$KEY" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect existing code and runtime metadata without env secrets
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" 'bash -s' <<'REMOTE'
          set -eu
          ROOT="$HOME/apps/trustfolio"
          echo "BACKEND_PATH:"
          ls -ld "$ROOT" "$ROOT/node-backend" "$ROOT/trustfolio-main"
          echo "GIT_ROOT:"
          (cd "$ROOT" && git rev-parse --show-toplevel && git status --short --untracked-files=no) || true
          echo "TEST_FILE_NAMES:"
          find "$ROOT/node-backend" -maxdepth 3 \( -iname '*test*.js' -o -name 'package.json' -o -name '*ecosystem*' \) -not -path '*/node_modules/*' | head -65
          echo "BACKEND_PACKAGE_SCRIPTS:"
          node -e "const p=require(process.argv[1]); console.log(JSON.stringify({scripts:p.scripts,engines:p.engines},null,2))" "$ROOT/node-backend/package.json"
          echo "PM2_PROCESSES_SAFE:"
          if command -v pm2 >/dev/null 2>&1; then pm2 jlist | node -e 'let s="";process.stdin.on("data",b=>s+=b);process.stdin.on("end",()=>{try{console.log(JSON.stringify(JSON.parse(s).map(x=>({name:x.name,pid:x.pid,status:x.pm2_env.status,exec_cwd:x.pm2_env.pm_cwd,script:x.pm2_env.pm_exec_path})),null,2))}catch(e){console.log("unavailable")}})'; else echo "pm2 not on PATH"; fi
          echo "NODE_TESTS_AVAILABLE:"
          node -p "process.version"
          echo "READ_ONLY_SITE_INSPECTION_DONE"
          REMOTE
