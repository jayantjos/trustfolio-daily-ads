name: Native staging runtime capability read only
on:
  push:
    branches: [production-readiness-final-20261103]
    paths: ['.github/workflows/production-readiness-native-capability.yml']
permissions:
  contents: read
jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Pinned existing VPS read-only capability check
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          [[ "$HOSTKEY" == "200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC" ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" 'sh -s' <<'SH'
          for tool in docker podman mongod mongosh unshare; do
            if command -v "$tool" >/dev/null 2>&1; then echo "CAPABILITY $tool PRESENT"; else echo "CAPABILITY $tool ABSENT"; fi
          done
          if command -v docker >/dev/null 2>&1; then timeout 3s docker info --format '{{.ServerVersion}}' 2>/dev/null || echo 'CAPABILITY docker-daemon INACCESSIBLE'; fi
          SH
      - name: Remove temporary SSH identity
        if: always()
        run: rm -f ~/.ssh/id_ed25519
