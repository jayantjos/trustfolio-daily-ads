name: TrustFolio live website-ranked ads integration QA
on:
  push:
    branches: [feature/ads-readonly-site-contract-20261016]
    paths:
      - 'site_top5_ads_v1.py'
      - 'test_site_top5_ads_v1.py'
      - 'test_campaign_link_contract_v1.py'
      - 'campaign_link_contract_v1.py'
      - 'ad_link_manifest_v1.py'
      - 'creative_config_v1.json'
      - '.github/workflows/site-ranked-ads-qa.yml'
  pull_request:
    paths:
      - 'site_top5_ads_v1.py'
      - 'test_site_top5_ads_v1.py'
      - 'test_campaign_link_contract_v1.py'
      - 'campaign_link_contract_v1.py'
      - 'ad_link_manifest_v1.py'
      - 'creative_config_v1.json'
      - '.github/workflows/site-ranked-ads-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit checks for direct budget/brand URL and website-ranked payload
        run: |
          python -m py_compile site_top5_ads_v1.py campaign_link_contract_v1.py ad_link_manifest_v1.py
          python -m unittest -v test_campaign_link_contract_v1 test_site_top5_ads_v1
      - name: Build a real source-verified smartwatch ad from public website API
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python site_top5_ads_v1.py --category smartwatches --budget 2000 --output artifacts/site-smartwatches-2000.json
          python - <<'PY'
          from pathlib import Path
          from ad_link_manifest_v1 import build_manifest
          import json
          data=json.loads(Path('artifacts/site-smartwatches-2000.json').read_text())
          config=json.loads(Path('creative_config_v1.json').read_text())
          manifest=build_manifest(data,config)
          ad=manifest['ads'][0]
          assert ad['site_ranking_status']=='verified'
          assert ad['prefill_ready'] is True
          assert ad['click_destination']=='filtered_products'
          assert len(ad['products']) == 5
          assert [p['ad_rank'] for p in ad['products']]==[1,2,3,4,5]
          assert 'budget=2000' in ad['landing_url']
          Path('artifacts/site-matched-campaign-manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False))
          print('REAL_WEBSITE_TOP5_CAMPAIGN_TEST_PASSED')
          print('RANKED_PRODUCT_IDS=' + ','.join(p['product_id'] for p in ad['products']))
          print('LIVE_CATEGORY_URL=' + ad['landing_url'])
          PY
      - name: Share validated public campaign data for image-generation QA
        uses: actions/upload-artifact@v4
        with:
          name: trustfolio-live-site-ranked-ads-campaign
          path: artifacts/
          retention-days: 7
