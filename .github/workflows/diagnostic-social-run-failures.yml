name: TrustFolio read-only scheduled posting Graph error diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/diagnostic-social-run-failures.yml'
permissions:
  actions: read
  contents: read
jobs:
  list-failed-social-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Inspect recent failed scheduled run and sanitized Meta Graph errors (no writes)
        run: |
          python - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          base='https://api.github.com/repos/jayantjos/trustfolio-daily-ads/'
          headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28',
                   'User-Agent':'TrustFolioReadonlyPostingAudit/1'}
          def get(path):
              with urlopen(Request(base+path,headers=headers),timeout=25) as r:
                  return json.load(r)
          def sanitized(job_id):
              url=base+'actions/jobs/'+str(job_id)+'/logs'
              try:
                  with urlopen(Request(url,headers=headers),timeout=40) as resp:
                      body=resp.read(4_000_000).decode('utf8','replace')
              except (HTTPError,URLError,TimeoutError) as e:
                  print('JOB_LOGS_UNAVAILABLE',job_id,type(e).__name__)
                  return
              patterns=('META_POST_BLOCKED_REASON=','GRAPH_CODE=',
                        'GRAPH_SUBCODE=','META_RESULT=',
                        'PriceAuditBlocked:','Website returned brand-fallback',
                        'META_PARTIAL_PUBLICATION_FAILURE')
              for line in body.splitlines():
                  if not any(p in line for p in patterns):
                      continue
                  for p in patterns:
                      at=line.find(p)
                      if at>=0:
                          excerpt=line[at:at+170]
                          excerpt=re.sub(r'(?i)(bearer|token|secret|authorization)[=:]\S+','[redacted]',excerpt)
                          print('SANITIZED_FAILURE',job_id,excerpt)
                          break
          runs=get('actions/workflows/auto-instagram-campaigns.yml/runs?per_page=75').get('workflow_runs') or []
          count=0
          for run in runs:
              if run.get('event')!='schedule' or run.get('created_at','')<'2026-10-27':
                  continue
              print('SCHEDULED_RUN',run['id'],run.get('created_at'),
                    run.get('conclusion'),run.get('html_url'))
              if run.get('conclusion')!='failure' or count>=6:
                  continue
              jobs=get('actions/runs/'+str(run['id'])+'/jobs?per_page=30').get('jobs') or []
              for job in jobs:
                  if job.get('conclusion')=='failure':
                      print('FAILED_JOB',job['id'],job.get('name'))
                      sanitized(job['id'])
                      count+=1
              if count>=6:
                  break
          print('READ_ONLY_GRAPH_DIAGNOSTIC_COMPLETE')
          PY
