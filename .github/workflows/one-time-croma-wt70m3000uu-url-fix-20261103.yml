name: One-time Croma Samsung WT70M3000UU clean URL replacement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-croma-wt70m3000uu-url-fix-20261103.yml']
permissions:
  contents: read
jobs:
  replace-one-url-and-restart-backend:
    if: github.repository == 'jayantjos/trustfolio-daily-ads' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate known VPS only
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Backup exact MongoDB document and replace one affiliate product_url
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'node -' <<'NODE'
          (async()=>{
            const cp=require('child_process'),fs=require('fs'),path=require('path');
            const processes=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',maxBuffer:10000000}));
            const p=processes.find(x=>x.name==='trustfolio-backend');
            if(!p || p.pm2_env.status!=='online')throw Error('Backend not online, refusing change');
            const cwd=p.pm2_env.pm_cwd,env=Object.assign({},p.pm2_env.env||{});
            for(const name of ['.env','.env.production'])if(fs.existsSync(path.join(cwd,name))){
              const str=fs.readFileSync(path.join(cwd,name),'utf8');
              for(const line of str.split(/\r?\n/)){
                const m=line.match(/^\s*(MONGO_URI|MONGODB_URI|DATABASE_URL|DB_URI)\s*=\s*(.*?)\s*$/);
                if(m&&!env[m[1]])env[m[1]]=m[2].replace(/^['"]|['"]$/g,'')
              }
            }
            const uri=env.MONGO_URI||env.MONGODB_URI||env.DATABASE_URL||env.DB_URI;
            if(!uri)throw Error('Missing MongoDB connection');
            const mongoose=require(path.join(cwd,'node_modules','mongoose'));
            await mongoose.connect(uri,{serverSelectionTimeoutMS:8000});
            const db=mongoose.connection.client.db('trustfolio');
            const col=db.collection('my_products');
            const id=new mongoose.Types.ObjectId('69f34f471dafb58cccdbddf0');
            const before=await col.findOne({_id:id});
            if(!before)throw Error('Exact product not found');
            const clean='https://www.croma.com/samsung-7-kg-5-star-semi-automatic-washing-machine-with-double-strong-pulsator-wt70m3000uu-tl-light-gray-voilet-/p/259282';
            const old='https://crma.clnk.in/Cejf';
            if(before.platform!=='croma'||before.category_slug!=='washing-machines'
               ||!/WT70M3000UU/i.test(before.title||'')
               ||before.clean_url!==clean||before.url!==clean){
              throw Error('Product identity, platform or clean URL mismatch; no write');
            }
            if(before.product_url===clean){
              console.log('MONGO_PRODUCT_URL_ALREADY_CLEAN=YES');
            }else{
              if(before.product_url!==old)throw Error('Unexpected product URL, refusing overwrite');
              const dir=path.join(require('os').homedir(),'trustfolio-db-backups','croma-clean-url');
              fs.mkdirSync(dir,{recursive:true,mode:0o700});
              const filename=path.join(dir,'before-wt70m3000uu-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json');
              const encoded=JSON.stringify(before,(k,v)=>{if(k==='_id'&&v&&v.toHexString)return v.toHexString();return v},2);
              fs.writeFileSync(filename,encoded,{flag:'wx',mode:0o600});
              fs.chmodSync(filename,0o600);
              console.log('BACKUP_WRITTEN_ON_VPS=YES');
              const q={_id:id,platform:'croma',category_slug:'washing-machines',
                        product_url:old,clean_url:clean,url:clean};
              const r=await col.updateOne(q,{$set:{product_url:clean}});
              if(r.matchedCount!==1||r.modifiedCount!==1)throw Error('Atomic MongoDB update failed or matched zero');
              console.log('MONGO_EXACT_DOCUMENTS_MODIFIED=1');
            }
            const after=await col.findOne({_id:id});
            if(after.product_url!==clean||after.clean_url!==clean||after.url!==clean)
              throw Error('Post-update MongoDB verification failed');
            console.log('MONGO_ID=69f34f471dafb58cccdbddf0');
            console.log('MONGO_CLEAN_URL_VERIFIED=YES');
            await mongoose.disconnect();
          })().catch(e=>{console.error('ONE_TIME_URL_FIX_ERROR='+e.name+':'+String(e.message).replace(/mongodb(\+srv)?:\/\/\S+/ig,'[REDACTED]'));process.exitCode=1});
          NODE
      - name: Restart only trustfolio-backend and verify online
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -s' <<'SH'
          set -euo pipefail
          pm2 restart trustfolio-backend >/dev/null
          sleep 3
          node - <<'NODE'
          const cp=require('child_process');
          const items=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',maxBuffer:10000000}));
          const p=items.find(x=>x.name==='trustfolio-backend');
          if(!p||p.pm2_env.status!=='online')throw Error('Backend PM2 restart failed');
          console.log('PM2_TRUSTFOLIO_BACKEND=online');
          console.log('PM2_RESTART_COUNT='+p.pm2_env.restart_time);
          NODE
          SH
