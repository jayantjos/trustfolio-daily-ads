name: Read-only VPS CPU voice capacity diagnostic
on:
  push:
    paths:
      - '.github/workflows/vps-voice-capacity-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure existing verified SSH identity
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test "$HOST" = "200.234.47.87"
          test "$USER" = "scraperuser"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
      - name: Read-only hardware diagnostics
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'echo "CPU_CORES=$(nproc)"; free -h; df -h /; python3 --version; if command -v nvidia-smi >/dev/null; then nvidia-smi --query-gpu=name,memory.total --format=csv,noheader; else echo "GPU=NONE"; fi'
