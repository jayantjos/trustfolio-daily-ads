name: Final three blockers read-only contract and exact allowlist integration
on:
  push:
    branches: [final-three-blockers-20261103]
    paths: ['.github/workflows/final-three-blockers-allowlist-current.yml']
permissions:
  contents: read
  actions: read
jobs:
  source:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate to existing VPS
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
      - name: Receive only staging public certificate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGING_BRANCH: final-three-blockers-20261103
        run: |
          for i in $(seq 1 80); do
            if gh api "repos/$GH_REPO/contents/qa/final-three-blockers/transport-public-cert.pem?ref=$STAGING_BRANCH" --jq .content 2>/dev/null | base64 --decode > staging-cert.pem; then
              if openssl x509 -in staging-cert.pem -noout >/dev/null 2>&1; then break; fi
            fi
            sleep 3
          done
          openssl x509 -in staging-cert.pem -noout >/dev/null
      - name: Read real source and approved bounded fixtures; production reads only
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" '$HOME/venv/bin/python -' <<'PY' > private-sources.json
          import json,re,hashlib,os,datetime
          from pathlib import Path
          from dotenv import load_dotenv
          from pymongo import MongoClient
          from bson import ObjectId
          root=Path.home()/'apps/trustfolio/node-backend'
          sources={}
          for folder in ['services','controllers','models','entities','utils','helpers','lib','data','scripts']:
           base=root/folder
           if base.exists():
            for p in base.rglob('*.js'):
             if 'node_modules' in p.parts:continue
             s=p.read_text();assert not re.search(r'mongodb(?:\+srv)?://',s)
             sources[str(p.relative_to(root))]=s
          load_dotenv(Path.home()/'new_scraper/.env')
          uri=os.getenv('MONGODB_URI') or os.getenv('MONGO_URI') or os.getenv('MONGODB_URL')
          c=MongoClient(uri,serverSelectionTimeoutMS=8000,appname='TrustFolioFinalReadOnlySource')
          col=c[os.getenv('MONGODB_DB','trustfolio')][os.getenv('PRODUCT_COLLECTION','my_products')]
          canaries=[];mapping={}
          ids=['6a080110fe6fd8dc386bbee3','69f419329a622ea2d7ccb736','6a1013380f397d1e1344dd59','6a2c08a19665e4a0b177b34b','69f419289a622ea2d7ccb608','69f4026f9a622ea2d7ccb2e6']
          pool=list(col.find({'_id':{'$in':[ObjectId(i) for i in ids]}}).max_time_ms(5000))
          c.close()
          print(json.dumps({'sources':sources,'sha256':{k:hashlib.sha256(v.encode()).hexdigest() for k,v in sources.items()},'canaries':canaries,'pool':pool,'mappingRecords':mapping,'readAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'productionWrites':0},default=str))
          
          PY
          rm -f ~/.ssh/id_ed25519
          python3 - <<'PY'
          import json
          x=json.load(open('private-sources.json'))
          print('SOURCE_SUMMARY='+json.dumps({'hashes':x['sha256'],'canaryIds':[str(d['_id']) for d in x['canaries']],'pool':[{'id':d['_id'],'title':d['title'],'platform':d['platform'],'price':d.get('price_inr')} for d in x['pool']],'mappingRecords':x['mappingRecords'],'productionWrites':0},default=str))
          PY
          gzip -c private-sources.json > private-sources.json.gz
          openssl cms -encrypt -binary -aes256 -in private-sources.json.gz -outform DER -out final-source.enc staging-cert.pem
          rm -f private-sources.json private-sources.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: final-real-encrypted-source
          path: final-source.enc
          retention-days: 1
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish temporary public encryption certificate only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGING_BRANCH: final-three-blockers-20261103
        run: |
          openssl req -x509 -newkey rsa:3072 -keyout staging-private.pem -out staging-cert.pem -sha256 -days 1 -nodes -subj '/CN=TrustFolioFinalIsolatedStage' >/dev/null 2>&1
          python3 - <<'PY'
          import json,base64,os
          from pathlib import Path
          Path('cert-payload.json').write_text(json.dumps({'message':'Publish temporary public staging transport certificate','branch':os.environ['STAGING_BRANCH'],'content':base64.b64encode(Path('staging-cert.pem').read_bytes()).decode()}))
          PY
          gh api -X PUT "repos/$GH_REPO/contents/qa/final-three-blockers/transport-public-cert.pem" --input cert-payload.json >/dev/null
      - name: Receive encrypted source and quote-only credential envelope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGING_BRANCH: final-three-blockers-20261103
        run: |
          set -euo pipefail
          for i in $(seq 1 140); do
            if gh run download "$GITHUB_RUN_ID" -n final-real-encrypted-source 2>/dev/null; then break; fi
            sleep 3
          done
          openssl cms -decrypt -binary -inform DER -in final-source.enc -recip staging-cert.pem -inkey staging-private.pem -out private-sources.json.gz
          gzip -dc private-sources.json.gz > private-sources.json
          for i in $(seq 1 140); do
            if gh api "repos/$GH_REPO/contents/qa/final-three-blockers/worker-key-envelope.json?ref=$STAGING_BRANCH" --jq .content 2>/dev/null | base64 --decode > key-envelope.json; then
              if python3 -c 'import json; assert json.load(open("key-envelope.json")).get("ciphertext")' 2>/dev/null; then break; fi
            fi
            sleep 3
          done
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          Path('worker-key.enc').write_bytes(base64.b64decode(json.load(open('key-envelope.json'))['ciphertext']))
          PY
          openssl cms -decrypt -binary -inform DER -in worker-key.enc -recip staging-cert.pem -inkey staging-private.pem -out worker-key.txt
          chmod 600 worker-key.txt
          rm -f staging-private.pem worker-key.enc private-sources.json.gz
      - name: Start only disposable Mongo replica set and isolated dependencies
        run: |
          docker run -d --name trustfolio-final-staging-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all >/dev/null
          for i in $(seq 1 30); do
            if docker exec trustfolio-final-staging-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec trustfolio-final-staging-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})' >/dev/null
          npm install --no-audit --no-fund --ignore-scripts mongoose@8 dotenv@16 express@4

      - name: Actual service controller ranker and watcher against real quotes
