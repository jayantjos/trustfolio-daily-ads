name: TF price logic targeted inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tf-price-details-20261025.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: SSH setup
        env:
          K: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          KH: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          H: ${{ secrets.TF_DEPLOY_HOST }}
          U: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test "$H" = '200.234.47.87'; test "$U" = 'scraperuser'
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KH" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
      - name: Logic excerpts (sensitive config excluded)
        env:
          H: ${{ secrets.TF_DEPLOY_HOST }}
          U: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$U@$H" 'python3 -' > tf-details.txt <<'PY'
          from pathlib import Path
          import re
          root=Path.home()/'apps/trustfolio/node-backend'
          files={'services/LivePriceService.js':[(40,71),(75,160)],
          'services/CategoryService.js':[(242,337)],
          'utils/resolveProductPrice.js':[(1,15)],
          'controllers/LivePriceController.js':[(1,85)],
          'config/mongo.js':[(1,46)],
          'controllers/ProductController.js':[(75,99),(395,426),(530,551),(627,642)],
          'controllers/CategoryController.js':[(344,366)]}
          deny=re.compile(r'password|secret|token|mongodb(\+srv)?://|authorization|api.?key|private_key|process\.env|dotenv',re.I)
          for fn,windows in files.items():
            p=root/fn
            if not p.exists(): print('MISSING',fn);continue
            ls=p.read_text(errors='replace').splitlines()
            print('FILE',fn,'N',len(ls))
            for lo,hi in windows:
              for i in range(lo,min(hi,len(ls))+1):
                line=ls[i-1]
                if deny.search(line):print(i,'[CONFIG_OMITTED]')
                else:print(i,line[:180])
          PY
      - name: Persist temporary report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f tf-details.txt || echo 'NOT_RUN' > tf-details.txt
          b="$(base64 -w0 tf-details.txt)"
          jq -n --arg message 'temporary TF price review report' --arg content "$b" '{message:$message,content:$content}' >/tmp/a.json
          curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' --data-binary @/tmp/a.json "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops-status/tf-price-details-20261025.txt" > /dev/null
