name: TrustFolio one-shot Instagram unpublished media HTTP 400 diagnosis
on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-ig-container-http400.yml'
permissions:
  contents: read
jobs:
  safe-private-ig-container:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TF_META_PAGE_ACCESS_TOKEN: ${{ secrets.TF_META_PAGE_ACCESS_TOKEN }}
      TF_META_PAGE_ID: ${{ vars.TF_META_PAGE_ID || '619193294620746' }}
      TF_META_GRAPH_VERSION: ${{ vars.TF_META_GRAPH_VERSION || 'v25.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose Instagram private unpublished image container (never publish a post)
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,time
          from urllib.request import Request,urlopen
          from automation.meta_readonly_preflight import run_read_only
          from automation.meta_graph_publish_v1 import _graph, PublishingBlocked
          origin='https://media.trustfolio.in/trustfolio-auto/'
          filename='tfauto-6bdc9ecda7240ec316.jpg'
          url=origin+filename
          try:
              with urlopen(Request(url,headers={'User-Agent':'TrustFolioIGContainerPreflight/1.0'}),
                           timeout=22) as res:
                  status=res.status
                  mime=res.headers.get('Content-Type','').lower()
                  body=res.read(12_000_000)
          except Exception as exc:
              print('PUBLIC_IMAGE_FETCH=FAIL',type(exc).__name__)
              raise SystemExit(2)
          print('PUBLIC_IMAGE_HTTP='+str(status))
          print('PUBLIC_IMAGE_MIME='+mime.split(';')[0])
          print('PUBLIC_IMAGE_BYTES='+str(len(body)))
          if status!=200 or 'image/jpeg' not in mime or not body.startswith(b'\xff\xd8\xff') or len(body)<1000:
              raise SystemExit('PUBLIC_IMAGE_NOT_VALID_JPEG')
          if len(body)>=12_000_000:
              raise SystemExit('PUBLIC_IMAGE_TOO_LARGE_FOR_DIAGNOSTIC')
          print('PUBLIC_IMAGE_JPEG=PASS')
          try:
              check=run_read_only()
              print('PAGE_OWNERSHIP_AND_IG_USERNAME=PASS')
              print('IG_QUOTA_USAGE='+str(check['instagram_quota']['quota_usage']))
              print('IG_QUOTA_TOTAL='+str(check['instagram_quota']['quota_total']))
              cfg={
                  'version':os.getenv('TF_META_GRAPH_VERSION') or 'v25.0',
                  'page_token':os.environ['TF_META_PAGE_ACCESS_TOKEN'],
              }
              igid=check['instagram_user_id']
              # This only CREATES AN UNPUBLISHED MEDIA CONTAINER.
              # It intentionally NEVER invokes the feed-publishing endpoint.
              result=_graph(cfg['version'],igid+'/media',cfg['page_token'],
                      post={'image_url':url,
                            'caption':'TrustFolio private image eligibility diagnostic. Not published.'})
              container=str(result.get('id') or '')
              if not re.fullmatch(r'[0-9]+',container):
                  raise PublishingBlocked('Instagram media creation did not return a numeric container ID')
              print('IG_PRIVATE_CONTAINER_CREATED=YES')
              status='UNKNOWN'
              for _ in range(5):
                  status=str(_graph(cfg['version'],container,cfg['page_token'],
                                   fields='status_code').get('status_code','UNKNOWN'))
                  print('IG_PRIVATE_CONTAINER_STATUS='+status)
                  if status in ('FINISHED','ERROR','EXPIRED','PUBLISHED'):
                      break
                  time.sleep(3)
              print('IG_MEDIA_CREATE_HTTP400_REPRODUCED=NO')
              if status!='FINISHED':
                  raise PublishingBlocked('Instagram private image container not fully processed: '+status)
              print('IG_IMAGE_CONTAINER_ELIGIBILITY=PASS')
          except PublishingBlocked as exc:
              reason=str(exc)
              if not re.fullmatch(r'[A-Za-z0-9_ /:;=.+@()\-]{1,280}',reason):
                  reason='Provider returned an unexpected error; consult redacted workflow error metadata'
              print('IG_IMAGE_CONTAINER_ELIGIBILITY=FAIL')
              print('IG_SAFE_REASON='+reason)
              raise SystemExit(1)
          finally:
              print('PUBLIC_FEED_POSTS_CREATED=0')
          PY
