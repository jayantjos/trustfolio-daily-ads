name: Deploy TrustFolio Instagram bio link hub (media only)
on:
  push:
    branches: [feature/instagram-bio-links-and-ai-provenance-20261016]
    paths:
      - 'automation/linkhub/**'
      - '.github/workflows/deploy-instagram-linkhub.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-linkhub:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate social links and static page before deploy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          source=Path('automation/linkhub/index.html').read_text(encoding='utf8')
          assert len(source) < 35000
          assert 'https://play.google.com/store/apps/details?id=com.trustfolio.app' in source
          assert 'https://www.trustfolio.in/category/headphones-earbuds/products?budget=3000' in source
          assert 'https://www.trustfolio.in/category/smartwatches/products?budget=2000' in source
          assert 'location.search' in source
          assert 'javascript:' not in source.lower()
          class Links(HTMLParser):
              def __init__(self): super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a': self.links.append(dict(attrs).get('href'))
          parser=Links();parser.feed(source)
          assert len(parser.links)>=4 and all(link.startswith('https://') for link in parser.links)
          print('LINK_HUB_SAFE_STATIC_AND_OFFICIAL_DESTINATIONS_VERIFIED')
          PY
      - name: Configure verified ads-server SSH
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
      - name: Upload HTML only to ads-media public directory
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          REMOTE="${USER}@${HOST}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" \
            'mkdir -p "$HOME/public_media/trustfolio-links" && chmod 755 "$HOME/public_media/trustfolio-links"'
          scp -o StrictHostKeyChecking=yes \
            automation/linkhub/index.html "$REMOTE:public_media/trustfolio-links/index.html"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" \
            'chmod 644 "$HOME/public_media/trustfolio-links/index.html"'
      - name: Verify public HTML and its actual content by HTTP
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen, Request
          import hashlib
          from pathlib import Path
          url='https://media.trustfolio.in/trustfolio-links/index.html'
          with urlopen(Request(url,headers={'User-Agent':'TrustFolioBioLinkQA/1.0'}),timeout=20) as response:
              data=response.read(100000)
              media=response.headers.get('Content-Type','').lower()
              assert response.status==200, response.status
              assert 'text/html' in media, 'Public server is not serving HTML as HTML'
          expected=Path('automation/linkhub/index.html').read_bytes()
          assert data==expected, 'Public page bytes did not match verified GitHub content'
          print('BIO_LINK_PAGE_DEPLOYED_AND_PUBLIC_BYTES_VERIFIED')
          print('PUBLIC_PAGE='+url)
          print('SHA256='+hashlib.sha256(expected).hexdigest())
          PY
