name: Verify TrustFolio category price range refresh 20261025
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trustfolio-category-refresh-test-20261025.yml']
permissions:
  contents: write
jobs:
  one-time-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: SSH setup
        env:
          K: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          KH: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          H: ${{ secrets.TF_DEPLOY_HOST }}
          U: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test "$H" = '200.234.47.87'; test "$U" = 'scraperuser'
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KH" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
      - name: Recalculate price ranges using existing backend API and summarize results
        env:
          H: ${{ secrets.TF_DEPLOY_HOST }}
          U: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$U@$H" 'python3 -' > refresh-test.txt 2>&1 <<'PY'
          import json,urllib.request,time,traceback
          base='http://127.0.0.1:8081/api/categories'
          def fetch(url,method='GET',timeout=30):
              with urllib.request.urlopen(urllib.request.Request(url,method=method),timeout=timeout) as res:
                  return res.status,json.load(res)
          def categories(x):
              d=x.get('data',[]) if isinstance(x,dict) else []
              if isinstance(d,dict):d=d.get('categories',[]) if isinstance(d.get('categories'),list) else []
              return d if isinstance(d,list) else []
          try:
              before_status,before=fetch(base)
              b=categories(before)
              print('BEFORE_HTTP',before_status,'CATEGORIES',len(b),'API_SUCCESS',before.get('success') if isinstance(before,dict) else None)
              t=time.monotonic()
              status,resp=fetch(base+'/update-all-price-ranges',method='POST',timeout=160)
              print('UPDATE_HTTP',status,'ELAPSED_SEC',round(time.monotonic()-t,1))
              print('UPDATE_SUCCESS',resp.get('success') if isinstance(resp,dict) else None)
              data=resp.get('data') if isinstance(resp,dict) else None
              if isinstance(data,list):
                  print('UPDATE_RESULT_ITEMS',len(data),'ITEM_TYPES',[type(x).__name__ for x in data[:3]])
                  print('UPDATE_RESULT_ERRORS',sum(1 for item in data if isinstance(item,dict) and (item.get('success') is False or bool(item.get('error')))))
              elif isinstance(data,dict):
                  print('UPDATE_DATA_KEYS',','.join(sorted(data.keys())[:20]))
                  print('UPDATE_COUNT',data.get('updated',data.get('count')))
              after_status,after=fetch(base)
              a=categories(after)
              print('AFTER_HTTP',after_status,'CATEGORIES',len(a),'API_SUCCESS',after.get('success') if isinstance(after,dict) else None)
              def bounds(items):
                  result={}
                  for c in items:
                      if isinstance(c,dict):
                          k=str(c.get('slug') or c.get('name') or c.get('_id') or '')
                          result[k]=(c.get('min_price',c.get('minPrice')),c.get('max_price',c.get('maxPrice')))
                  return result
              bb,aa=bounds(b),bounds(a)
              print('CATEGORY_BOUNDS_CHANGED',sum(bb.get(k)!=v for k,v in aa.items()))
              print('CATEGORY_BOUNDS_PRESENT',sum(v[0] is not None or v[1] is not None for v in aa.values()))
              print('REFRESH_TEST_DONE')
              if status!=200 or not resp.get('success'):raise SystemExit(3)
          except Exception as e:
              print('REFRESH_TEST_ERROR',type(e).__name__,str(e)[:300])
              raise
          PY
      - name: Store short result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f refresh-test.txt || echo 'REFRESH_TEST_NOT_RUN' > refresh-test.txt
          b="$(base64 -w0 refresh-test.txt)"
          jq -n --arg message 'ops: temporary category refresh result' --arg content "$b" '{message:$message,content:$content}' >/tmp/post.json
          curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' --data-binary @/tmp/post.json "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops-status/trustfolio-refresh-test-20261025.txt" > /dev/null
