name: TrustFolio 20-category cron rotation regression QA
on:
  push:
    branches: [fix/20-category-daily-rotation-and-cron-20261017]
    paths:
      - 'automation/campaigns.json'
      - 'automation/auto_campaign_v1.py'
      - 'automation/test_20_category_rotation.py'
      - '.github/workflows/auto-instagram-campaigns.yml'
      - '.github/workflows/20-category-cron-qa.yml'
  pull_request:
    paths:
      - 'automation/campaigns.json'
      - 'automation/auto_campaign_v1.py'
      - 'automation/test_20_category_rotation.py'
      - '.github/workflows/auto-instagram-campaigns.yml'
      - '.github/workflows/20-category-cron-qa.yml'
permissions:
  contents: read
jobs:
  safe-daily-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependency for packaging regressions
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Test twenty category budget and brand daily rotation
        run: |
          set -euo pipefail
          python -m py_compile automation/auto_campaign_v1.py
          python -m unittest -v automation.test_20_category_rotation automation.test_auto_campaign_v1
      - name: Test website ranking parity and 20-category typography labels
        run: |
          python -m unittest -v ads_qa.test_category_copy_v1 test_site_top5_ads_v1 test_campaign_link_contract_v1
      - name: Ensure automatic publishing remains safely disabled by default
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          f=Path('.github/workflows/auto-instagram-campaigns.yml').read_text()
          cfg=json.loads(Path('automation/campaigns.json').read_text())
          assert 'mode=plan[\'mode\']' in f
          assert "TF_AUTO_POST_ENABLED" in f
          assert "TF_METRICOOL_API_TOKEN" in f
          assert len(cfg['rotation']['categories'])==20
          assert "apps/trustfolio" not in str(cfg)
          print('TWENTY_CATEGORY_CRON_MODE_FORWARDED_SAFE_BY_DEFAULT')
          PY
