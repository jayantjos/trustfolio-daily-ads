name: Cross-store availability and Flipkart false-delete safety tests
on:
  push:
    branches: [diagnostics/croma-direct-live-price-20261027]
    paths: [.github/workflows/croma-ui-static-check.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile ops/croma-direct/patch_ui_checking.py
      - run: bash -n ops/croma-direct/deploy_ui_checking.sh
      - run: node ops/availability-policy/ProductAvailabilityPolicy.test.js
      - run: python3 -m py_compile ops/availability-policy/apply_policy.py
      - run: bash -n ops/availability-policy/deploy_on_vps.sh
      - run: node --check ops/availability-policy/ProductAvailabilityPolicy.js
      - run: node --check ops/availability-policy/ProductAvailabilityPolicy.test.js
