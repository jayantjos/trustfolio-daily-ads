          'use strict';
          const {catalogVariantConflicts}=require('./CatalogIdentityGuard');
          const asin=x=>/^[A-Z0-9]{10}$/.test(x),pid=x=>/^[A-Z]{3}[A-Z0-9]{13}$/.test(x)&&!/^ITM/i.test(x);
          function workerItem(doc){
           const platform=String(doc.platform||'').toLowerCase(),id=String(doc.platform_product_id||doc.asin||'').toUpperCase();
           const urls=[doc.original_product_url,doc.clean_url,doc.product_url,doc.url,doc.productUrl].filter(Boolean);
           if(platform==='amazon'){
            const fromUrls=urls.flatMap(s=>{try{const u=new URL(s);if(!/^(www\.)?amazon\.in$/.test(u.hostname))return[];const m=u.pathname.match(/\/(?:dp|gp\/product)\/([A-Z0-9]{10})(?:\/|$)/i);return m?[m[1].toUpperCase()]:[];}catch{return[];}});
            const ids=[...(asin(id)?[id]:[]),...fromUrls];return ids.length&&new Set(ids).size===1?ids[0]:null;
           }
           if(platform==='flipkart')for(const s of urls){try{
            const u=new URL(s);if(u.protocol!=='https:'||!/^(www\.)?flipkart\.com$/.test(u.hostname)||!u.pathname.includes('/p/itm'))continue;
            const p=String(u.searchParams.get('pid')||'').toUpperCase();
            if(p&&(!pid(p)||(pid(id)&&id!==p)))return null;
            const exact=p||(pid(id)?id:null);if(exact){u.search='';u.hash='';u.searchParams.set('pid',exact);return u.href;}
           }catch{}}
           return null;
          }
          function validateWorkerQuote(doc,item,r){
           const amazon=String(doc.platform).toLowerCase()==='amazon',expected=amazon?item:new URL(item).searchParams.get('pid');
           const actual=amazon?r.asin:r.pid,s=amazon?r.amazon:r.flipkart;
           const reject=error=>({status:'error',error,in_stock:null});
           if(!expected||actual!==expected||!s)return reject('identity_mismatch');
           try{const u=new URL(s.url);if(amazon){if(!/^(www\.)?amazon\.in$/.test(u.hostname)||!u.pathname.includes('/'+expected))return reject('retailer_url_mismatch');}else if(!/^(www\.)?flipkart\.com$/.test(u.hostname)||u.searchParams.get('pid')!==expected)return reject('retailer_url_mismatch');}catch{return reject('retailer_url_missing');}
           if(!s.title)return reject('catalog_identity_unverified');
           const n=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
           if(doc.brand&&!n(s.title).includes(n(doc.brand)))return reject('catalog_brand_mismatch');
           const conflicts=catalogVariantConflicts(doc,{name:s.title});
           const model=doc.model_number||doc.model||doc.specifications?.['Model Number'];
           if(model&&!n(s.title).includes(n(model)))conflicts.push({field:'model'});
           if(conflicts.length)return reject('catalog_variant_mismatch');
           return {...s,retailer_product_id:actual,retailer_url:s.url};
          }
          module.exports={workerItem,validateWorkerQuote};
