name: TrustFolio server ads visual QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ads-visual-qa.yml', 'ads_qa/**', 'master_template_renderer_html_v4.py', 'renderer_v12_helper.py']
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == '200.234.47.87' && "$USER" == 'scraperuser' ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
      - name: Render with existing server code (read-only source)
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/new_scraper/ads"
          test -f master_template_renderer_html_v4.py
          test -f assets/trustfolio_reference_master_v1.jpg
          test -f trustfolio_infographic_payload_v1.json
          "$HOME/venv/bin/python" master_template_renderer_html_v4.py trustfolio_infographic_payload_v1.json tf-aa5900f0c166
          test -s generated_creatives/feed/tf-aa5900f0c166_final_html_v3_1024x1536.png
          REMOTE
          mkdir -p qa
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}:new_scraper/ads/generated_creatives/feed/tf-aa5900f0c166_final_html_v3_1024x1536.png" qa/server-render.png
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}:new_scraper/ads/assets/trustfolio_reference_master_v1.jpg" qa/server-reference.jpg
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" 'test -s "$HOME/new_scraper/ads/assets/trustfolio_approved_reference.png"'; then
            scp -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}:new_scraper/ads/assets/trustfolio_approved_reference.png" qa/approved-reference.png
          fi
      - name: Compare reference and server render
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageChops, ImageStat, ImageEnhance
          from pathlib import Path
          approved=Path('qa/approved-reference.png')
          a=Image.open(approved if approved.exists() else 'qa/server-reference.jpg').convert('RGB')
          b=Image.open('qa/server-render.png').convert('RGB')
          if a.size!=b.size: raise SystemExit(f'Wrong size: {b.size}, expected {a.size}')
          stat=ImageStat.Stat(ImageChops.difference(a,b))
          mae=sum(stat.mean)/3
          print(f'SERVER_RENDER_SIZE={b.size[0]}x{b.size[1]}')
          print(f'PIXEL_MAE_VS_{"APPROVED" if approved.exists() else "LEGACY"}_REFERENCE={mae:.2f} (0=identical, 255=opposite)')
          diff=ImageChops.difference(a,b)
          ImageEnhance.Contrast(diff).enhance(3).save('qa/visual-difference.png')
          Path('qa/metrics.txt').write_text(f'render_size={b.size}\nmae={mae:.2f}\napproved_reference_present={approved.exists()}\n')
          if not approved.exists():
              raise SystemExit('FAIL: approved reference missing; legacy server reference cannot approve design')
          if mae > 15:
              raise SystemExit(f'FAIL: visual MAE {mae:.2f} > 15.00')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustfolio-server-render-qa
          path: qa/
          if-no-files-found: warn
