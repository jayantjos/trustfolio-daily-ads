name: TrustFolio server ads visual QA
on:
  workflow_run:
    workflows: [TrustFolio production deploy]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: trustfolio-server-visual-qa
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  render-and-compare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure verified SSH
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == '200.234.47.87' && "$USER" == 'scraperuser' ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
      - name: Render two payloads and verify design on VPS
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p qa
          status=0
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" "bash -s -- '$REVISION'" <<'REMOTE' || status=$?
          set -euo pipefail
          cd "$HOME/new_scraper/ads"
          test "$(cat .trustfolio_deployed_sha)" = "$1"
          "$HOME/venv/bin/python" ads_qa/verify_template.py "generated_creatives/visual_qa/$1"
          REMOTE
          scp -r -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}:new_scraper/ads/generated_creatives/visual_qa/$REVISION/." qa/
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustfolio-server-render-qa
          path: qa/
          if-no-files-found: warn


