name: Read-only category range invalidation source inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/price-audit-range-source-20261102.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate to existing VPS
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
      - name: Inspect existing backend metadata and authentication without DB writes
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=20 "${USER}@${HOST}" '$HOME/venv/bin/python -' <<'PY' > backend-price-inspection.json
          import json,re,hashlib,subprocess
          from pathlib import Path
          root=Path.home()/'apps'/'trustfolio'/'node-backend'
          source=(root/'controllers'/'ProductController.js').read_text()
          functions=[]
          for m in re.finditer(r'^(?:async\s+)?function\s+([A-Za-z0-9_]+)\s*\(',source,re.M):
              if not re.search(r'price|bound|range|invalidate',m[1],re.I):continue
              end=re.search(r'^\}',source[m.start():],re.M)
              body=source[m.start():m.start()+end.end()] if end else ''
              functions.append({'name':m[1],'source':body})
          caches=[s for s in source.splitlines() if re.search(r'cache|CACHE',s) and re.search(r'const |let |\\.clear\\(|\\.delete\\(',s)]
          procs=json.loads(subprocess.check_output(['pm2','jlist'],text=True,stderr=subprocess.DEVNULL))
          watcher=next((p.get('pm2_env',{}) for p in procs if p.get('name')=='trustfolio-price-watcher'),{})
          path=Path(watcher.get('pm_exec_path','/nonexistent'))
          watcher_source=path.read_text() if path.is_file() else ''
          watcher_summary={'path_found':path.is_file(),'sha256':hashlib.sha256(watcher_source.encode()).hexdigest() if watcher_source else None,'range_refresh_lines':[s for s in watcher_source.splitlines() if re.search(r'RANGE|range|price.*refresh|refresh.*price',s,re.I)][:50]}
          print(json.dumps({'production_writes':0,'controller_sha256':hashlib.sha256(source.encode()).hexdigest(),'functions':functions,'cache_lines':caches,'watcher':watcher_summary}))
          PY
          cat backend-price-inspection.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-price-readonly-inspection
          path: backend-price-inspection.json
          retention-days: 30
