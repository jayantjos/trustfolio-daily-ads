name: Remove only temporary encrypted staging source artifacts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/staging-source-artifact-cleanup.yml']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only public certificates and encrypted source transport for recorded runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run in 41482920776 41483116872 41483277644; do
            gh api "repos/$GH_REPO/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "staging-source-public-cert" or .name == "staging-encrypted-current-source") | .id' > artifact-ids.txt
            while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
              echo "REMOVED_TEMPORARY_SOURCE_ARTIFACT=$id"
            done < artifact-ids.txt
          done
          echo 'ACCEPTANCE_RESULT_ARTIFACTS_PRESERVED=true'
