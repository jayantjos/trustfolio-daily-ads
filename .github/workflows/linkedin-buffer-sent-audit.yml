name: TrustFolio verify LinkedIn Buffer delivery for all three modes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linkedin-buffer-sent-audit.yml', 'automation/buffer_verify_linkedin_sent_v1.py', 'automation/test_buffer_verify_linkedin_sent_v1.py']
  schedule:
    # Check after 21:00, 22:00 and 23:00 IST to catch delayed delivery.
    - cron: '30 15 * * *'
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'
    # Morning catch-up: GitHub cron may run after midnight IST.
    - cron: '15 2 * * *'
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trustfolio-extended-social-one-at-a-time
  cancel-in-progress: false
jobs:
  verify-buffer-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TF_BUFFER_API_KEY: ${{ secrets.TF_BUFFER_API_KEY }}
      TF_BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.TF_BUFFER_LINKEDIN_CHANNEL_ID || '6ae212582f1f5ed648fd63b5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify provider sent status and immutable ledger mapping
        run: |
          set -euo pipefail
          python -m unittest -v automation.test_buffer_verify_linkedin_sent_v1
          failed=0
          for mode in budget brand_budget comparison; do
            python -m automation.buffer_verify_linkedin_sent_v1 --mode "$mode" || failed=1
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::LinkedIn delivery not confirmed; review Buffer provider statuses before any retry"
            exit 1
          fi
          echo "LINKEDIN_DELIVERY_CHECK_DONE=YES"
