name: TrustFolio one-shot filtered Learn More crosspost test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-filtered-learn-more-test-20261025.yml'

permissions:
  contents: write
concurrency:
  group: trustfolio-social-publication
  cancel-in-progress: false

jobs:
  render-qa-schedule:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'TrustFolio authorized ceiling-fans CTA one-shot 2026-10-25'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MEDIA_BASE: https://media.trustfolio.in
      MEDIA_PREFIX: trustfolio-auto
      TF_AUTO_POST_ENABLED: ${{ vars.TF_AUTO_POST_ENABLED || 'false' }}
      # Proven live Meta IG+FB publication, 2026-10-17; repo variable "false" is emergency OFF switch.
      TF_META_DIRECT_PUBLISH_ENABLED: ${{ vars.TF_META_DIRECT_PUBLISH_ENABLED || 'true' }}
      TF_META_POST_NETWORKS: ${{ vars.TF_META_POST_NETWORKS || 'instagram,facebook' }}
      # Six reviewed and capped mode slots/day, two each; live Meta limits still apply.
      TF_META_MAX_POSTS_PER_DAY_PER_NETWORK: '6'
      TF_META_START_DATE: ${{ vars.TF_META_START_DATE || '2026-10-21' }}
      TF_META_PAGE_ID: ${{ vars.TF_META_PAGE_ID || '619193294620746' }}
      TF_META_GRAPH_VERSION: ${{ vars.TF_META_GRAPH_VERSION || 'v25.0' }}
      TF_METRICOOL_BLOG_ID: ${{ vars.TF_METRICOOL_BLOG_ID || '7271681' }}
      TF_METRICOOL_USER_ID: ${{ vars.TF_METRICOOL_USER_ID || '5635852' }}
      RUN_KEY: ${{ github.run_id }}
    steps:
      - name: Check out reviewed ads source
        uses: actions/checkout@v4
      - name: Set up Python and image processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependency and run tests
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python -m unittest -v automation.test_auto_campaign_v1 automation.test_20_category_rotation automation.test_live_price_before_publish_v1 automation.test_verify_price_before_meta_publish_v1
          python -m unittest -v test_campaign_link_contract_v1 test_site_top5_ads_v1 test_ads_spec_sanity
      - name: Select a never-published category with valid live Top 5
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p campaign
          python - <<'PY'
          import json,os,re
          from datetime import date,datetime,timedelta
          from pathlib import Path
          from urllib.parse import urlencode
          from zoneinfo import ZoneInfo
          from automation.auto_campaign_v1 import campaign_id,choose_campaign
          from automation.meta_graph_publish_v1 import _github, PublishingBlocked, LEDGER_BRANCH
          today=datetime.now(ZoneInfo('Asia/Kolkata')).date()
          policy=json.loads(Path('automation/campaigns.json').read_text())
          entries={e['site_slug']:e for e in policy['rotation']['categories']}
          candidates=[
            ('ceiling-fans',5000),('induction-cooktop',5000),
            ('geyser-water-heater',12000),('cooler',12000),
            ('microwave-oven',18000),('tablets',35000),
            ('speakers',10000),('air-conditioner',45000),
            ('fridge-refrigeration',35000),('washing-machines',35000),
            ('smart-tvs',40000),('laptops',75000)]
          # The GitHub ledger is authoritative for already-published/attempted
          # official Meta posts. Fail closed if its status cannot be read.
          by_day={}
          cursor=date(2026,10,21)
          while cursor<=today:
            day=cursor.isoformat()
            try:
              result=_github(os.environ['GITHUB_TOKEN'],
                'contents/meta-publication-ledger/'+day+'?'+urlencode({'ref':LEDGER_BRANCH}))
            except PublishingBlocked as error:
              if 'HTTP 404' not in str(error):
                raise
              result=[]
            if not isinstance(result,list):
              raise RuntimeError('Malformed publication ledger')
            by_day[day]={match.group(1) for item in result
              if (match:=re.fullmatch(
                r'(?:instagram|facebook)-(tfauto-[a-f0-9]{18})[.]json',
                str(item.get('name',''))))}
            cursor+=timedelta(days=1)
          def previously_posted(category):
            e=entries[category]
            for day,existing in by_day.items():
              if not existing:
                continue
              for amount in e['budgets']:
                for mode in ('budget','comparison','brand_budget'):
                  brands=e.get('brands',[]) if mode=='brand_budget' else ['']
                  for brand in brands:
                    if campaign_id(day,mode,category,amount,brand) in existing:
                      return True
            return False
          # Never repeat this test when a previous successful or ambiguous
          # attempt has reserved the same candidate in today's audit ledger.
          today_reserved=by_day[today.isoformat()]
          if any(campaign_id(today,'budget',cat,amount,'') in today_reserved
                 for cat,amount in candidates):
            raise SystemExit('One-shot candidate already reserved today; manual review required')
          eligible=None
          for category,budget in candidates:
            if previously_posted(category):
              print('SKIP_PREVIOUS_CATEGORY='+category)
              continue
            plan=choose_campaign('budget',policy,day=today,slot=0,
              overrides={'category':category,'budget':budget,'brand':''})
            if plan['status']=='eligible':
              eligible=plan
              break
            print('SKIP_NO_VERIFIED_TOP_FIVE='+category)
          if eligible is None:
            raise SystemExit('No new category with five live-ranked products; no social post attempted')
          Path('campaign/plan.json').write_text(json.dumps(eligible,indent=2)+'\n')
          print('SELECTED_NEW_CATEGORY='+eligible['category'])
          print('SELECTED_BUDGET_INR='+str(eligible['budget']))
          print('SELECTED_CAMPAIGN_ID='+eligible['campaign_id'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            out.write('eligible=true\n')
            out.write('campaign_id='+eligible['campaign_id']+'\n')
            out.write('publish=false\n')
          PY

      - name: Authenticate against exact authorized VPS (ads folder only)
        if: steps.plan.outputs.eligible == 'true'
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null

      - name: Render original website-ranked ad on VPS
        if: steps.plan.outputs.eligible == 'true'
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$RUN_KEY" =~ ^[0-9]+$ ]]
          REMOTE="${USER}@${HOST}"
          REMOTE_REL="new_scraper/ads/ads_qa/auto-runs/$RUN_KEY"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "mkdir -p \"\$HOME/$REMOTE_REL\""
          scp -o StrictHostKeyChecking=yes campaign/plan.json "$REMOTE:$REMOTE_REL/plan.json"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "cd \"\$HOME/new_scraper/ads\" && \"\$HOME/venv/bin/python\" - '$RUN_KEY'" <<'PY'
          import json,sys
          from pathlib import Path
          key=sys.argv[1]
          assert key.isdecimal()
          root=Path.home()/'new_scraper'/'ads'
          folder=root/'ads_qa'/'auto-runs'/key
          plan=json.loads((folder/'plan.json').read_text('utf8'))
          assert plan['status']=='eligible' and plan['account']=='trustfolio3'
          sys.path.insert(0,str(root))
          from ads_qa.render_site_ranked_qa_v1 import run
          run(plan['category'],int(plan['budget']),plan['brand'],folder,mode=plan['mode'])
          PY
          scp -o StrictHostKeyChecking=yes "$REMOTE:$REMOTE_REL/trustfolio-live-website-top5-1024x1536.png" campaign/
          scp -o StrictHostKeyChecking=yes "$REMOTE:$REMOTE_REL/website-top5-render-qa.json" campaign/

      - name: Validate exact rank mapping and create full-size Instagram 4:5 JPG/caption
        if: steps.plan.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          python automation/auto_campaign_v1.py package \
            --plan campaign/plan.json \
            --report campaign/website-top5-render-qa.json \
            --image campaign/trustfolio-live-website-top5-1024x1536.png \
            --output-dir campaign/post

      - name: Save immutable GitHub QA and social media artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trustfolio-social-campaign-${{ github.run_id }}
          path: campaign/
          retention-days: 30
          if-no-files-found: warn

      - name: Stage QA-approved JPG on ads media host (does not publish)
        if: steps.plan.outputs.eligible == 'true'
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^tfauto-[a-f0-9]{18}$ ]]
          REMOTE="${USER}@${HOST}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" 'mkdir -p "$HOME/public_media/trustfolio-auto"'
          scp -o StrictHostKeyChecking=yes "campaign/post/$ID.jpg" "$REMOTE:public_media/trustfolio-auto/$ID.jpg"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "chmod 644 \"\$HOME/public_media/trustfolio-auto/$ID.jpg\""

      - name: Verify media URL publicly serves the exact approved JPEG
        if: steps.plan.outputs.eligible == 'true'
        env:
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          python - "$ID" <<'PY'
          import sys
          from automation.metricool_publish_v1 import _check_media
          key=sys.argv[1]
          assert key.startswith('tfauto-')
          url='https://media.trustfolio.in/trustfolio-auto/'+key+'.jpg'
          _check_media(url,'campaign/post/'+key+'.jpg')
          print('PUBLIC_MEDIA_SHA256_VERIFIED='+key)
          PY

      - name: Validate direct Meta API media eligibility without publishing
        if: steps.plan.outputs.eligible == 'true'
        env:
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          python automation/meta_graph_publish_v1.py \
            --manifest campaign/post/post.json \
            --jpg "campaign/post/$ID.jpg" \
            --media-url "$MEDIA_BASE/$MEDIA_PREFIX/$ID.jpg" \
            --preflight-only

      - name: Publish to verified Instagram and Facebook through official Meta Graph API
        # Two candidates per mode/day: budget, brand+budget, Top-5 comparison.
        # Website must return all five same-brand products or brand slot skips.
        # Old Oct 20-25 Metricool queue was canceled into drafts; no duplicate posting.
        if: steps.plan.outputs.eligible == 'true' && env.TF_META_DIRECT_PUBLISH_ENABLED == 'true' && github.event_name == 'push' && github.event.head_commit.message == 'TrustFolio authorized ceiling-fans CTA one-shot 2026-10-25'
        env:
          TF_META_PAGE_ACCESS_TOKEN: ${{ secrets.TF_META_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          # Previously queued Metricool Instagram posts were converted to drafts;
          # do not use that stale queue. All six approved cron slots now publish
          # the same verified JPG to BOTH Meta accounts from Oct 21 onward.
          # GitHub cron jobs may be delayed: use today's actual IST date.
          today_ist="$(TZ=Asia/Kolkata date +%F)"
          if [[ "$today_ist" < "2026-10-21" ]]; then
            echo "META_AUTO_PUBLICATION=WAITING_UNTIL_2026-10-21_IST"
            exit 0
          fi
          export TF_META_POST_NETWORKS=instagram,facebook
          export TF_META_START_DATE=2026-10-21
          echo "META_DIRECT_PUBLISH_TARGET=INSTAGRAM_AND_FACEBOOK"
          echo "INSTAGRAM_METRICOOL_OLD_QUEUE=CANCELED_TO_DRAFTS"
          # Recheck same product IDs, ranks, real displayed prices and sources
          # immediately before Meta publishing: skip if final JPEG became stale.
          python automation/verify_price_before_meta_publish_v1.py \
            --plan campaign/plan.json \
            --report campaign/website-top5-render-qa.json
          python automation/meta_graph_publish_v1.py \
            --manifest campaign/post/post.json \
            --jpg "campaign/post/$ID.jpg" \
            --media-url "$MEDIA_BASE/$MEDIA_PREFIX/$ID.jpg"

      - name: Post via Metricool ONLY after media/identity/duplicate preflight
        if: steps.plan.outputs.eligible == 'true' && steps.plan.outputs.publish == 'true' && env.TF_META_DIRECT_PUBLISH_ENABLED != 'true'
        env:
          TF_METRICOOL_API_TOKEN: ${{ secrets.TF_METRICOOL_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          python automation/metricool_publish_v1.py \
            --manifest campaign/post/post.json \
            --jpg "campaign/post/$ID.jpg" \
            --media-url "$MEDIA_BASE/$MEDIA_PREFIX/$ID.jpg"

      - name: Explain legacy Metricool QA mode
        if: steps.plan.outputs.eligible == 'true' && steps.plan.outputs.publish != 'true'
        run: |
          echo "CREATIVE_ARTIFACT_UPLOADED=YES"
          echo "METRICOOL_UNATTENDED_PUBLICATION=DISABLED"
          echo "META_DIRECT_PUBLICATION=SIX_DAILY_SLOTS_IG_AND_FB_FROM_OCT21"
          echo "SOURCE_WEBSITE_APPS_MODIFIED=NO"
