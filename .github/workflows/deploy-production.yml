name: TrustFolio production deploy
on:
  push:
    branches: [main]
    paths: ['*.py', 'ads_qa/**', 'deploy/**', '.github/workflows/deploy-production.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trustfolio-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check campaign URL, source-ranking parity and URL security
        run: |
          python -m unittest -v test_campaign_link_contract_v1 test_site_top5_ads_v1
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('creative_config_v1.json').read_text())
          links=config['links']
          assert links['budget_query_parameter']['frontend_verified'] is True
          assert links['results_url_template']=='https://www.trustfolio.in/category/{route_slug}/products'
          PY
      - name: Validate Python and deployment allowlist
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for line in Path('deploy/managed-files.txt').read_text().splitlines():
              f=line.strip()
              if f and not f.startswith('#'):
                  assert '..' not in f and not f.startswith('/') and Path(f).is_file(), f
                  if f.endswith('.py'):
                      ast.parse(Path(f).read_text(encoding='utf-8'), filename=f)
          PY
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          # Validate without printing any secret values.
          if [[ "$HOST" != "200.234.47.87" ]]; then
            echo "::error::TF_DEPLOY_HOST must be the exact server IP (no ssh://, username, spaces or newline)"
            exit 1
          fi
          if [[ "$USER" != "scraperuser" ]]; then
            echo "::error::TF_DEPLOY_USER must be the exact SSH username"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::TF_DEPLOY_SSH_KEY is not a valid unencrypted SSH private key"
            exit 1
          fi
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          if [[ "$HOSTKEY" != "$expected" ]]; then
            echo "::error::TF_DEPLOY_KNOWN_HOSTS does not match the independently verified server ED25519 host key"
            exit 1
          fi
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Test SSH authentication (no production changes)
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o PasswordAuthentication=no -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "${USER}@${HOST}" 'test "$(id -un)" = scraperuser && echo "SSH_AUTH_SUCCESS"'
      - name: Deploy allowlisted files with backup and rollback
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          REMOTE="${USER}@${HOST}"
          SHA="$GITHUB_SHA"
          mkdir -p /tmp/tf-release
          while IFS= read -r f; do
            [[ -z "$f" || "$f" == \#* ]] && continue
            mkdir -p "/tmp/tf-release/$(dirname "$f")"
            cp "$f" "/tmp/tf-release/$f"
          done < deploy/managed-files.txt
          mkdir -p /tmp/tf-release/deploy
          cp deploy/{deploy.sh,managed-files.txt} /tmp/tf-release/deploy/
          tar -czf /tmp/tf-release.tgz -C /tmp/tf-release .
          ssh -o StrictHostKeyChecking=yes "$REMOTE" 'mkdir -p "$HOME/trustfolio_releases"'
          scp -o StrictHostKeyChecking=yes /tmp/tf-release.tgz "$REMOTE:trustfolio_releases/$SHA.tgz"
          ssh -o StrictHostKeyChecking=yes "$REMOTE" "set -e; mkdir -p \"\$HOME/trustfolio_releases/$SHA\"; tar -xzf \"\$HOME/trustfolio_releases/$SHA.tgz\" -C \"\$HOME/trustfolio_releases/$SHA\"; bash \"\$HOME/trustfolio_releases/$SHA/deploy/deploy.sh\" \"\$HOME/trustfolio_releases/$SHA\" '$SHA'"
