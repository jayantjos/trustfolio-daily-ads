name: TrustFolio MongoDB original-ranker live-budget patch CI
on:
  push:
    branches: [fix/trustfolio-backend-budget-rerank-20261018]
    paths: ['site_patches/**', '.github/workflows/site-budget-live-rerank-ci.yml']
  pull_request:
    paths: ['site_patches/**']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Unit tests, syntax and shell checks
        run: |
          set -euo pipefail
          node --test site_patches/LiveBudgetRecommendationService.test.js
          node --check site_patches/LiveBudgetRecommendationService.js
          python3 -m py_compile site_patches/apply_live_budget_patch.py
          bash -n site_patches/deploy_live_budget_from_staging.sh
