name: Read-only encrypted current backend staging snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/staging-current-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate to existing VPS
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
      - name: Read source only; exclude environment and database credentials
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" '$HOME/venv/bin/python -' <<'PYSRC' > private-sources.json
          import json,re,hashlib
          from pathlib import Path
          root=Path.home()/'apps/trustfolio/node-backend'
          sources={}
          for folder in ['services','controllers','models','utils','helpers','lib','scripts']:
            base=root/folder
            if base.exists():
              for p in base.rglob('*.js'):
                if 'node_modules' in p.parts:continue
                s=p.read_text()
                if re.search(r'mongodb(?:\+srv)?://[^\s\x27\x22]+',s):continue
                sources[str(p.relative_to(root))]=s
          sources['package.json']=(root/'package.json').read_text()
          print(json.dumps({'sources':sources,'sha256':{k:hashlib.sha256(v.encode()).hexdigest() for k,v in sources.items()},'productionWrites':0}))
          PYSRC
          rm -f ~/.ssh/id_ed25519
          cat > snapshot-cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEKTCCApGgAwIBAgIUKB3x5ZL0JatgdN1bLkiUuXC3TskwDQYJKoZIhvcNAQEL
