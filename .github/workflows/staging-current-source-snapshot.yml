          CERT
          gzip -c private-sources.json > source.json.gz
          openssl cms -encrypt -binary -aes256 -in source.json.gz -outform DER -out snapshot.enc snapshot-cert.pem
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          s=json.loads(Path('private-sources.json').read_text())
          print('SOURCE_MANIFEST='+json.dumps({'sha256':s['sha256'],'productionWrites':0,'credentialsRead':False}))
          b=base64.b64encode(Path('snapshot.enc').read_bytes()).decode()
          for i in range(0,len(b),8000):print('ENCRYPTED_SOURCE='+b[i:i+8000])
