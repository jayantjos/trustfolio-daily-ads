name: Read-only native old Worker rollback route control
on:
  push:
    branches: [worker-safe-cutover-20261103]
    paths: ['.github/workflows/worker-safe-old-route.yml']
permissions:
  contents: read
jobs:
  old-route:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Old route with actual default Node client; zero retailer items
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" 'cd "$HOME/apps/trustfolio/node-backend" && node -' <<'JS'
          const cp=require('child_process'),crypto=require('crypto');
          const p=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8'})).find(p=>p.name==='trustfolio-backend');
          const file=require('dotenv').parse(require('fs').readFileSync('.env'));
          const e={...file,...p.pm2_env.env,...Object.fromEntries(Object.entries(p.pm2_env).filter(([k,v])=>typeof v==='string'))};
          const url=String(e.PRICE_WORKER_URL||'').replace(/\/+$/,'');
          if(url!=='https://spring-shape-2759.1shailendrasoni1.workers.dev')throw new Error('Unexpected rollback route');
          const headers={'content-type':'application/json'};if(e.PRICE_WORKER_KEY)headers['x-api-key']=e.PRICE_WORKER_KEY;
          const start=performance.now();
          fetch(url+'/api/check',{method:'POST',headers,body:JSON.stringify({items:[],useCache:false,browserProbe:false}),signal:AbortSignal.timeout(10000)})
          .then(async r=>{const t=await r.text();let b;try{b=JSON.parse(t)}catch{b=null}
          console.log('OLD_ROUTE_NODE='+JSON.stringify({at:new Date().toISOString(),client:'native Node fetch unchanged',url,http:r.status,latencyMS:Math.round(performance.now()-start),ray:r.headers.get('cf-ray'),contentType:r.headers.get('content-type'),cfMitigated:r.headers.get('cf-mitigated'),jsonResponse:!!b,hasResultsArray:Array.isArray(b?.results),htmlTitle:t.match(/<title>([^<]{0,180})<\/title>/i)?.[1]||null,bodySHA256:crypto.createHash('sha256').update(t).digest('hex'),credentialPresent:!!e.PRICE_WORKER_KEY,retailerItems:0,productionChanges:0}));})
          .catch(e=>console.log('OLD_ROUTE_NODE='+JSON.stringify({error:e.name,retailerItems:0,productionChanges:0})));
          JS
