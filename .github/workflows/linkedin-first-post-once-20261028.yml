name: TrustFolio first LinkedIn post - owner approved one-time
on:
  pull_request:
    paths:
      - '.github/workflows/linkedin-first-post-once-20261028.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/linkedin-first-post-once-20261028.yml'

permissions:
  contents: write
  actions: read
concurrency:
  group: trustfolio-linkedin-first-post-20261028
  cancel-in-progress: false

jobs:
  verify-and-schedule-first:
    if: github.repository == 'jayantjos/trustfolio-daily-ads'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      TF_BUFFER_API_KEY: ${{ secrets.TF_BUFFER_API_KEY }}
      TF_BUFFER_FREE_PUBLISH_ENABLED: ${{ vars.TF_BUFFER_FREE_PUBLISH_ENABLED || 'false' }}
      TF_BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.TF_BUFFER_LINKEDIN_CHANNEL_ID || '6ae212582f1f5ed648fd63b5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download already Meta-approved immutable TrustFolio JPEG
        uses: actions/download-artifact@v4
        with:
          name: trustfolio-social-campaign-40572781421
          path: source-social-ad
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40572781421
      - name: Verify original IG+FB ledger, exact JPEG, fresh rank and price, then ONLY on main schedule LinkedIn
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from automation.linkedin_x_crosspost_v1 import validate_source,check_meta_success
          from automation.verify_price_before_meta_publish_v1 import verify_fresh_snapshot
          from automation.metricool_publish_v1 import _check_media
          from automation.buffer_free_crosspost_v1 import verify_buffer_channel,schedule_if_enabled
          IST=ZoneInfo('Asia/Kolkata')
          day=datetime.now(IST).date().isoformat()
          if day!='2026-10-28':
              raise SystemExit('ONE_TIME_LINKEDIN_EXPIRED_IST_DATE='+day)
          post,jpg,url=validate_source('source-social-ad',verify_live=False)
          if (post['date_ist']!='2026-10-28'
                  or post['campaign_id']!='tfauto-188e676b2497b48271'
                  or post['mode']!='brand_budget'
                  or post['brand']!='Eureka Forbes'
                  or int(post['budget_inr'])!=20000):
              raise SystemExit('ONE_TIME_LINKEDIN_SOURCE_IDENTITY_CHANGED')
          token=os.environ['GITHUB_TOKEN']
          check_meta_success(token,post)
          print('ONE_TIME_LINKEDIN_ORIGINAL_META_BOTH=PASS',flush=True)
          _check_media(url,str(jpg))
          print('ONE_TIME_LINKEDIN_ORIGINAL_JPEG_SHA=PASS',flush=True)
          root=Path('source-social-ad')
          plan=json.loads(next(root.rglob('plan.json')).read_text('utf8'))
          report=json.loads(next(root.rglob('website-top5-render-qa.json')).read_text('utf8'))
          # This is an older (same-day) poster. The only exception to the
          # default 20-min age limit is allowed here, after an exact fresh
          # comparison against live TrustFolio GET Top-5 and POST live prices.
          # No changed rank, product, displayed price, or provenance may post.
          fresh=verify_fresh_snapshot(plan,report,max_age_seconds=86400)
          assert fresh['five_ranked_products']==5
          print('ONE_TIME_LINKEDIN_LIVE_TOP5_PRICE_RANK_MATCH=PASS',flush=True)
          print('ONE_TIME_LINKEDIN_CAMPAIGN_ID='+post['campaign_id'],flush=True)
          # No credentials printed. The Buffer read-only check is not a post.
          expected='6ae212582f1f5ed648fd63b5'
          key=os.environ.get('TF_BUFFER_API_KEY') or ''
          channel=os.environ.get('TF_BUFFER_LINKEDIN_CHANNEL_ID') or ''
          if channel!=expected:
              raise SystemExit('ONE_TIME_LINKEDIN_WRONG_BUFFER_CHANNEL')
          found=verify_buffer_channel(key,'linkedin',expected)
          if found.get('name')!='trustfolio-in':
              raise SystemExit('ONE_TIME_LINKEDIN_ACCOUNT_MISMATCH')
          print('ONE_TIME_LINKEDIN_BUFFER_CHANNEL=trustfolio-in VERIFIED',flush=True)
          if os.environ['GITHUB_EVENT_NAME']!='push':
              print('ONE_TIME_LINKEDIN_PR_DRY_RUN=PASS; POSTS_CREATED=0',flush=True)
          else:
              if os.environ.get('TF_BUFFER_FREE_PUBLISH_ENABLED')!='true':
                  raise SystemExit('ONE_TIME_LINKEDIN_LIVE_DISABLED_IN_GITHUB_VARIABLE')
              result=schedule_if_enabled('linkedin',post,url,os.environ,gh_token=token)
              if result not in ('scheduled','duplicate'):
                  raise SystemExit('ONE_TIME_LINKEDIN_NOT_SCHEDULED='+str(result))
              print('ONE_TIME_LINKEDIN_BUFFER_RESULT='+result,flush=True)
              print('ONE_TIME_LINKEDIN_ONLY_ONE_APPROVED_MODE=brand_budget',flush=True)
          PY
