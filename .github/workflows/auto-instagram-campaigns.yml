name: TrustFolio automated Instagram campaigns
on:
  push:
    branches: [main]
    paths: ['automation/**', '.github/workflows/auto-instagram-campaigns.yml']
  schedule:
    # UTC; local Asia/Kolkata times are 08:30 / 13:30 / 19:00.
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "budget, brand_budget or comparison"
        required: true
        type: choice
        options: [budget, brand_budget, comparison]
      category:
        description: "Optional manual category (must also provide budget)"
        required: false
        type: string
      budget:
        description: "Optional manual budget in INR"
        required: false
        type: string
      brand:
        description: "Brand name for manual brand_budget runs"
        required: false
        type: string
      publish:
        description: "Allow Metricool publication only if global enabled and credentials valid"
        type: boolean
        default: false

permissions:
  contents: write
concurrency:
  group: trustfolio-social-publication
  cancel-in-progress: false

jobs:
  render-qa-schedule:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MEDIA_BASE: https://media.trustfolio.in
      MEDIA_PREFIX: trustfolio-auto
      TF_AUTO_POST_ENABLED: ${{ vars.TF_AUTO_POST_ENABLED || 'false' }}
      TF_META_DIRECT_PUBLISH_ENABLED: ${{ vars.TF_META_DIRECT_PUBLISH_ENABLED || 'false' }}
      TF_META_POST_NETWORKS: ${{ vars.TF_META_POST_NETWORKS || 'instagram,facebook' }}
      TF_META_MAX_POSTS_PER_DAY_PER_NETWORK: ${{ vars.TF_META_MAX_POSTS_PER_DAY_PER_NETWORK || '2' }}
      TF_META_START_DATE: ${{ vars.TF_META_START_DATE || '2026-10-26' }}
      TF_META_PAGE_ID: ${{ vars.TF_META_PAGE_ID || '619193294620746' }}
      TF_META_GRAPH_VERSION: ${{ vars.TF_META_GRAPH_VERSION || 'v25.0' }}
      TF_METRICOOL_BLOG_ID: ${{ vars.TF_METRICOOL_BLOG_ID || '7271681' }}
      TF_METRICOOL_USER_ID: ${{ vars.TF_METRICOOL_USER_ID || '5635852' }}
      RUN_KEY: ${{ github.run_id }}
    steps:
      - name: Check out reviewed ads source
        uses: actions/checkout@v4
      - name: Set up Python and image processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependency and run tests
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python -m unittest -v automation.test_auto_campaign_v1
          python -m unittest -v test_campaign_link_contract_v1 test_site_top5_ads_v1 test_ads_spec_sanity
      - name: Pick eligible site-ranked campaign deterministically
        id: plan
        env:
          EVENT_TYPE: ${{ github.event_name }}
          CRON_TRIGGER: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_BUDGET: ${{ inputs.budget }}
          INPUT_BRAND: ${{ inputs.brand }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p campaign
          python - <<'PY'
          import json,os,subprocess,sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          cron_modes={'0 3 * * *':'budget','0 8 * * *':'brand_budget','30 13 * * *':'comparison'}
          event=os.getenv('EVENT_TYPE')
          mode=cron_modes.get(os.getenv('CRON_TRIGGER')) if event=='schedule' else ('budget' if event=='push' else os.getenv('INPUT_MODE'))
          if mode not in ('budget','brand_budget','comparison'): raise SystemExit('Unrecognized scheduling mode')
          cmd=[sys.executable,'automation/auto_campaign_v1.py','select','--mode',mode,
               '--day',datetime.now(ZoneInfo('Asia/Kolkata')).date().isoformat(),
               '--output','campaign/plan.json']
          if os.getenv('EVENT_TYPE')!='schedule':
              for name in ('category','budget','brand'):
                  value=os.getenv('INPUT_'+name.upper())
                  if value: cmd.extend(('--'+name,value))
          subprocess.run(cmd,check=True)
          plan=json.load(open('campaign/plan.json'))
          status=plan['status']
          print('CAMPAIGN_MODE='+mode)
          print('CAMPAIGN_STATUS='+status)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('eligible='+('true' if status=='eligible' else 'false')+'\n')
              out.write('campaign_id='+str(plan.get('campaign_id') or '')+'\n')
              allow_publish=(
                  os.getenv('TF_AUTO_POST_ENABLED')=='true'
                  and (os.getenv('EVENT_TYPE')=='schedule' or os.getenv('INPUT_PUBLISH')=='true')
              )
              out.write('publish='+('true' if allow_publish else 'false')+'\n')
          PY

      - name: Authenticate against exact authorized VPS (ads folder only)
        if: steps.plan.outputs.eligible == 'true'
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null

      - name: Render original website-ranked ad on VPS
        if: steps.plan.outputs.eligible == 'true'
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$RUN_KEY" =~ ^[0-9]+$ ]]
          REMOTE="${USER}@${HOST}"
          REMOTE_REL="new_scraper/ads/ads_qa/auto-runs/$RUN_KEY"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "mkdir -p \"\$HOME/$REMOTE_REL\""
          scp -o StrictHostKeyChecking=yes campaign/plan.json "$REMOTE:$REMOTE_REL/plan.json"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "cd \"\$HOME/new_scraper/ads\" && \"\$HOME/venv/bin/python\" - '$RUN_KEY'" <<'PY'
          import json,sys
          from pathlib import Path
          key=sys.argv[1]
          assert key.isdecimal()
          root=Path.home()/'new_scraper'/'ads'
          folder=root/'ads_qa'/'auto-runs'/key
          plan=json.loads((folder/'plan.json').read_text('utf8'))
          assert plan['status']=='eligible' and plan['account']=='trustfolio3'
          sys.path.insert(0,str(root))
          from ads_qa.render_site_ranked_qa_v1 import run
          run(plan['category'],int(plan['budget']),plan['brand'],folder,mode=plan['mode'])
          PY
          scp -o StrictHostKeyChecking=yes "$REMOTE:$REMOTE_REL/trustfolio-live-website-top5-1024x1536.png" campaign/
          scp -o StrictHostKeyChecking=yes "$REMOTE:$REMOTE_REL/website-top5-render-qa.json" campaign/

      - name: Validate exact rank mapping and create full-size Instagram 4:5 JPG/caption
        if: steps.plan.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          python automation/auto_campaign_v1.py package \
            --plan campaign/plan.json \
            --report campaign/website-top5-render-qa.json \
            --image campaign/trustfolio-live-website-top5-1024x1536.png \
            --output-dir campaign/post

      - name: Save immutable GitHub QA and social media artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trustfolio-social-campaign-${{ github.run_id }}
          path: campaign/
          retention-days: 30
          if-no-files-found: warn

      - name: Stage QA-approved JPG on ads media host (does not publish)
        if: steps.plan.outputs.eligible == 'true'
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^tfauto-[a-f0-9]{18}$ ]]
          REMOTE="${USER}@${HOST}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" 'mkdir -p "$HOME/public_media/trustfolio-auto"'
          scp -o StrictHostKeyChecking=yes "campaign/post/$ID.jpg" "$REMOTE:public_media/trustfolio-auto/$ID.jpg"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "chmod 644 \"\$HOME/public_media/trustfolio-auto/$ID.jpg\""

      - name: Verify media URL publicly serves the exact approved JPEG
        if: steps.plan.outputs.eligible == 'true'
        env:
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          python - "$ID" <<'PY'
          import sys
          from automation.metricool_publish_v1 import _check_media
          key=sys.argv[1]
          assert key.startswith('tfauto-')
          url='https://media.trustfolio.in/trustfolio-auto/'+key+'.jpg'
          _check_media(url,'campaign/post/'+key+'.jpg')
          print('PUBLIC_MEDIA_SHA256_VERIFIED='+key)
          PY

      - name: Validate direct Meta API media eligibility without publishing
        if: steps.plan.outputs.eligible == 'true'
        env:
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          python automation/meta_graph_publish_v1.py \
            --manifest campaign/post/post.json \
            --jpg "campaign/post/$ID.jpg" \
            --media-url "$MEDIA_BASE/$MEDIA_PREFIX/$ID.jpg" \
            --preflight-only

      - name: Publish to verified Instagram and Facebook through official Meta Graph API
        if: steps.plan.outputs.eligible == 'true' && env.TF_META_DIRECT_PUBLISH_ENABLED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
        env:
          TF_META_PAGE_ACCESS_TOKEN: ${{ secrets.TF_META_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          python automation/meta_graph_publish_v1.py \
            --manifest campaign/post/post.json \
            --jpg "campaign/post/$ID.jpg" \
            --media-url "$MEDIA_BASE/$MEDIA_PREFIX/$ID.jpg"

      - name: Post via Metricool ONLY after media/identity/duplicate preflight
        if: steps.plan.outputs.eligible == 'true' && steps.plan.outputs.publish == 'true'
        env:
          TF_METRICOOL_API_TOKEN: ${{ secrets.TF_METRICOOL_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          python automation/metricool_publish_v1.py \
            --manifest campaign/post/post.json \
            --jpg "campaign/post/$ID.jpg" \
            --media-url "$MEDIA_BASE/$MEDIA_PREFIX/$ID.jpg"

      - name: Explain QA-only mode
        if: steps.plan.outputs.eligible == 'true' && steps.plan.outputs.publish != 'true'
        run: |
          echo "CREATIVE_ARTIFACT_UPLOADED=YES"
          echo "PUBLICATION=DISABLED_UNTIL_TF_AUTO_POST_ENABLED_TRUE"
          echo "SOURCE_WEBSITE_APPS_MODIFIED=NO"
