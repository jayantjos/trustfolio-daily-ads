name: TrustFolio automated Instagram campaigns
on:
  push:
    branches: [main]
    paths: ['automation/**', '.github/workflows/auto-instagram-campaigns.yml']
  schedule:
    # IST main 08:30/13:30/19:00; recovery 10:30/16:00/21:00.
    # Extra missed-post catch-up 19:30 budget, 20:30 brand, 22:15 comparison.
    # Only ONE published campaign per mode per network per date; 3 IG + 3 FB.
    - cron: '0 3 * * *'
    - cron: '0 5 * * *'
    - cron: '0 8 * * *'
    - cron: '30 10 * * *'
    - cron: '30 13 * * *'
    - cron: '30 15 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '45 16 * * *'
    # Final same-day rescue runs for modes not yet published.
    - cron: '0 16 * * *'
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'
    # Off-minute watchdog: one missed slot cannot silently stop all daily posts.
    - cron: '17,47 3-17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "budget, brand_budget or comparison"
        required: true
        type: choice
        options: [budget, brand_budget, comparison]
      category:
        description: "Optional manual category (must also provide budget)"
        required: false
        type: string
      budget:
        description: "Optional manual budget in INR"
        required: false
        type: string
      brand:
        description: "Brand name for manual brand_budget runs"
        required: false
        type: string
      publish:
        description: "Allow Metricool publication only if global enabled and credentials valid"
        type: boolean
        default: false

permissions:
  contents: write
concurrency:
  group: trustfolio-social-publication
  cancel-in-progress: false

jobs:
  render-qa-schedule:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDIA_BASE: https://media.trustfolio.in
      MEDIA_PREFIX: trustfolio-auto
      TF_AUTO_POST_ENABLED: ${{ vars.TF_AUTO_POST_ENABLED || 'false' }}
      # Proven live Meta IG+FB publication, 2026-10-17; repo variable "false" is emergency OFF switch.
      TF_META_DIRECT_PUBLISH_ENABLED: ${{ vars.TF_META_DIRECT_PUBLISH_ENABLED || 'true' }}
      TF_META_POST_NETWORKS: ${{ vars.TF_META_POST_NETWORKS || 'instagram,facebook' }}
      # Three distinct daily formats per network; recovery triggers never add posts.
      TF_META_MAX_POSTS_PER_DAY_PER_NETWORK: '3'
      TF_META_START_DATE: ${{ vars.TF_META_START_DATE || '2026-10-21' }}
      TF_META_PAGE_ID: ${{ vars.TF_META_PAGE_ID || '619193294620746' }}
      TF_META_GRAPH_VERSION: ${{ vars.TF_META_GRAPH_VERSION || 'v25.0' }}
      TF_METRICOOL_BLOG_ID: ${{ vars.TF_METRICOOL_BLOG_ID || '7271681' }}
      TF_METRICOOL_USER_ID: ${{ vars.TF_METRICOOL_USER_ID || '5635852' }}
      RUN_KEY: ${{ github.run_id }}
    steps:
      - name: Check out reviewed ads source
        uses: actions/checkout@v4
      - name: Skip recovery rendering when both platforms already published this mode
        id: already_done
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON_TRIGGER: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import base64,json,os
          from datetime import datetime
          from urllib.error import HTTPError
          from urllib.request import Request,urlopen
          from zoneinfo import ZoneInfo
          from automation.schedule_recovery_v1 import select_due_mode

          now=datetime.now(ZoneInfo('Asia/Kolkata'))
          day=now.date().isoformat()
          cache={}
          def both_published(mode):
              if mode in cache:
                  return cache[mode]
              completed=[]
              for network in ('instagram','facebook'):
                  path=f"meta-publication-ledger/{day}/{network}-mode-{mode}.json"
                  url=("https://api.github.com/repos/jayantjos/trustfolio-daily-ads/contents/"
                       +path+"?ref=trustfolio-meta-publishing-ledger")
                  req=Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                                           'Accept':'application/vnd.github+json'})
                  try:
                      with urlopen(req,timeout=20) as response:
                          content=json.load(response)['content']
                      record=json.loads(base64.b64decode(content).decode('utf8'))
                      completed.append(record.get('status')=='api_accepted_published')
                  except HTTPError as error:
                      if error.code!=404:
                          raise
                      completed.append(False)
              cache[mode]=all(completed)
              return cache[mode]

          cron=os.environ['CRON_TRIGGER']
          mode=select_due_mode(cron,now,both_published)
          skipped=(mode is None)
          print('META_SCHEDULE_CRON='+cron+' IST_DATE='+day+
                ' MODE='+str(mode)+' SKIP='+str(skipped))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('skip='+str(skipped).lower()+'\n')
              if mode:
                  out.write('mode='+mode+'\n')
          PY

      - name: Set up Python and image processing
        if: steps.already_done.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependency and run tests
        if: steps.already_done.outputs.skip != 'true'
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python automation/rebuild_stale_meta_campaign_v1.py --help >/dev/null
          python -m unittest -v automation.test_schedule_recovery_v1
          python -m unittest -v automation.test_auto_campaign_v1 automation.test_20_category_rotation automation.test_live_price_before_publish_v1 automation.test_verify_price_before_meta_publish_v1 automation.test_rebuild_stale_meta_v1
          python -m unittest -v test_campaign_link_contract_v1 test_site_top5_ads_v1 test_ads_spec_sanity
      - name: Build published category/budget history before new campaign
        if: github.event_name == 'schedule' && steps.already_done.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/posting_history_v1.py --output campaign/history.json --lookback-days 45

      - name: Pick eligible site-ranked campaign deterministically
        if: steps.already_done.outputs.skip != 'true'
        id: plan
        env:
          EVENT_TYPE: ${{ github.event_name }}
          CRON_TRIGGER: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          RESOLVED_MODE: ${{ steps.already_done.outputs.mode }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_BUDGET: ${{ inputs.budget }}
          INPUT_BRAND: ${{ inputs.brand }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p campaign
          python - <<'PY'
          import json,os,subprocess,sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          cron_modes={
              '0 3 * * *':('budget',0), '0 5 * * *':('budget',0),
              '0 8 * * *':('brand_budget',0), '30 10 * * *':('brand_budget',0),
              '30 13 * * *':('comparison',0), '30 15 * * *':('comparison',0),
              '0 14 * * *':('budget',0), '0 15 * * *':('brand_budget',0),
              '45 16 * * *':('comparison',0),
              '0 16 * * *':('budget',0),
              '30 16 * * *':('brand_budget',0),
              '30 17 * * *':('comparison',0),
          }
          event=os.getenv('EVENT_TYPE')
          if event=='schedule':
              mode=os.getenv('RESOLVED_MODE')
              if mode not in ('budget','brand_budget','comparison'):
                  raise SystemExit('No safely due scheduled mode selected')
              slot=0
          else:
              mode='budget' if event=='push' else os.getenv('INPUT_MODE')
              slot=0
          if mode not in ('budget','brand_budget','comparison'): raise SystemExit('Unrecognized scheduling mode')
          cmd=[sys.executable,'automation/auto_campaign_v1.py','select','--mode',mode,'--slot',str(slot),
               '--day',datetime.now(ZoneInfo('Asia/Kolkata')).date().isoformat(),
               '--output','campaign/plan.json']
          if os.getenv('EVENT_TYPE')!='schedule':
              for name in ('category','budget','brand'):
                  value=os.getenv('INPUT_'+name.upper())
                  if value: cmd.extend(('--'+name,value))
          if event=='schedule':
              cmd.extend(('--used-budgets-file','campaign/history.json'))
          subprocess.run(cmd,check=True)
          plan=json.load(open('campaign/plan.json'))
          status=plan['status']
          print('CAMPAIGN_MODE='+mode)
          print('CAMPAIGN_SLOT='+str(slot))
          print('CAMPAIGN_STATUS='+status)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('eligible='+('true' if status=='eligible' else 'false')+'\n')
              out.write('campaign_id='+str(plan.get('campaign_id') or '')+'\n')
              allow_publish=(
                  os.getenv('TF_AUTO_POST_ENABLED')=='true'
                  and (os.getenv('EVENT_TYPE')=='schedule' or os.getenv('INPUT_PUBLISH')=='true')
              )
              out.write('publish='+('true' if allow_publish else 'false')+'\n')
          PY

      - name: Fail visibly when no genuine eligible Top-5 campaign exists
        if: github.event_name == 'schedule' && steps.already_done.outputs.skip != 'true' && steps.plan.outputs.eligible != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('campaign/plan.json').read_text('utf8'))
          print('SOCIAL_PUBLICATION_BLOCKED='+str(plan.get('status')))
          for attempt in (plan.get('attempts') or [])[:10]:
              print('SOURCE_REJECTED={category}/{budget}/{brand}/{reason}'.format(**attempt))
          raise SystemExit('No five verified products found within safe retry limits')
          PY

      - name: Authenticate against exact authorized VPS (ads folder only)
        if: steps.plan.outputs.eligible == 'true'
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null

      - name: Render and safely try another verified brand or budget if website changes
        if: steps.plan.outputs.eligible == 'true'
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          HISTORY_ARGS=()
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            HISTORY_ARGS=(--used-budgets-file campaign/history.json)
          fi
          python automation/render_with_brand_fallback_v1.py \
            --plan campaign/plan.json \
            --folder campaign \
            --run-key "$RUN_KEY" \
            --host "$HOST" --user "$USER" \
            --max-renders 3 "${HISTORY_ARGS[@]}"

      - name: Validate exact rank mapping and create full-size Instagram 4:5 JPG/caption
        if: steps.plan.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          python automation/auto_campaign_v1.py package \
            --plan campaign/plan.json \
            --report campaign/website-top5-render-qa.json \
            --image campaign/trustfolio-live-website-top5-1024x1536.png \
            --output-dir campaign/post

      - name: Save immutable GitHub QA and social media artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trustfolio-social-campaign-${{ github.run_id }}
          path: campaign/
          retention-days: 30
          if-no-files-found: warn

      - name: Stage QA-approved JPG on ads media host (does not publish)
        if: steps.plan.outputs.eligible == 'true'
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ID="$(python -c 'import json;print(json.load(open("campaign/plan.json"))["campaign_id"])')"
          [[ "$ID" =~ ^tfauto-[a-f0-9]{18}$ ]]
          REMOTE="${USER}@${HOST}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" 'mkdir -p "$HOME/public_media/trustfolio-auto"'
          scp -o StrictHostKeyChecking=yes "campaign/post/$ID.jpg" "$REMOTE:public_media/trustfolio-auto/$ID.jpg"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE" "chmod 644 \"\$HOME/public_media/trustfolio-auto/$ID.jpg\""

      - name: Verify media URL publicly serves the exact approved JPEG
        if: steps.plan.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          ID="$(python -c 'import json;print(json.load(open("campaign/plan.json"))["campaign_id"])')"
          python - "$ID" <<'PY'
          import sys
          from automation.metricool_publish_v1 import _check_media
          key=sys.argv[1]
          assert key.startswith('tfauto-')
          url='https://media.trustfolio.in/trustfolio-auto/'+key+'.jpg'
          _check_media(url,'campaign/post/'+key+'.jpg')
          print('PUBLIC_MEDIA_SHA256_VERIFIED='+key)
          PY

      - name: Validate direct Meta API media eligibility without publishing
        if: steps.plan.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          ID="$(python -c 'import json;print(json.load(open("campaign/plan.json"))["campaign_id"])')"
          python automation/meta_graph_publish_v1.py \
            --manifest campaign/post/post.json \
            --jpg "campaign/post/$ID.jpg" \
            --media-url "$MEDIA_BASE/$MEDIA_PREFIX/$ID.jpg" \
            --preflight-only

      - name: Publish to verified Instagram and Facebook through official Meta Graph API
        # One publication per mode/day with two scheduled recovery opportunities.
        # Each schedule call may produce at most one IG and one FB post.
        # Website must return all five same-brand products or brand slot skips.
        # Old Oct 20-25 Metricool queue was canceled into drafts; no duplicate posting.
        if: steps.plan.outputs.eligible == 'true' && env.TF_META_DIRECT_PUBLISH_ENABLED == 'true' && github.event_name == 'schedule' && steps.already_done.outputs.skip != 'true'
        env:
          TF_META_PAGE_ACCESS_TOKEN: ${{ secrets.TF_META_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          # Previously queued Metricool posts remain drafts. Daily per-mode
          # network locks ensure only 3 Instagram + 3 Facebook posts, even when
          # a recovery cron retries after a missed or partially failed run.
          # GitHub cron jobs may be delayed: use today's actual IST date.
          today_ist="$(TZ=Asia/Kolkata date +%F)"
          if [[ "$today_ist" < "2026-10-21" ]]; then
            echo "META_AUTO_PUBLICATION=WAITING_UNTIL_2026-10-21_IST"
            exit 0
          fi
          export TF_META_POST_NETWORKS=instagram,facebook
          export TF_META_START_DATE=2026-10-21
          echo "META_DIRECT_PUBLISH_TARGET=INSTAGRAM_AND_FACEBOOK"
          echo "INSTAGRAM_METRICOOL_OLD_QUEUE=CANCELED_TO_DRAFTS"
          # Recheck same product IDs, ranks, real displayed prices and sources
          # immediately before Meta publishing: skip if final JPEG became stale.
          if ! python automation/verify_price_before_meta_publish_v1.py \
            --plan campaign/plan.json \
            --report campaign/website-top5-render-qa.json; then
            # A changed website ranking/price invalidates the OLD poster.
            # Render a NEW immutable JPEG and run fresh rank/price/SHA QA.
            # Fail closed if the website remains unstable or genuine Top-5 missing.
            python automation/rebuild_stale_meta_campaign_v1.py \
              --folder campaign --run-key "$RUN_KEY" \
              --host "$HOST" --user "$USER" --max-rebuilds 3 \
              --used-budgets-file campaign/history.json
          fi
          ID="$(python -c 'import json;print(json.load(open("campaign/plan.json"))["campaign_id"])')"
          [[ "$ID" =~ ^tfauto-[a-f0-9]{18}$ ]]
          python automation/meta_graph_publish_v1.py \
            --manifest campaign/post/post.json \
            --jpg "campaign/post/$ID.jpg" \
            --media-url "$MEDIA_BASE/$MEDIA_PREFIX/$ID.jpg"

      - name: Archive FINAL verified Meta campaign for optional LinkedIn and X reuse
        # After publication, because a ranking drift can rebuild the JPG and ID.
        # This does not publish anything and does not change Meta scheduling.
        if: always() && github.event_name == 'schedule' && steps.plan.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trustfolio-social-final-${{ github.run_id }}
          path: campaign/
          retention-days: 30
          if-no-files-found: warn

      - name: Post via Metricool ONLY after media/identity/duplicate preflight
        if: steps.plan.outputs.eligible == 'true' && steps.plan.outputs.publish == 'true' && env.TF_META_DIRECT_PUBLISH_ENABLED != 'true'
        env:
          TF_METRICOOL_API_TOKEN: ${{ secrets.TF_METRICOOL_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.plan.outputs.campaign_id }}
        run: |
          set -euo pipefail
          python automation/metricool_publish_v1.py \
            --manifest campaign/post/post.json \
            --jpg "campaign/post/$ID.jpg" \
            --media-url "$MEDIA_BASE/$MEDIA_PREFIX/$ID.jpg"

      - name: Explain legacy Metricool QA mode
        if: steps.plan.outputs.eligible == 'true' && steps.plan.outputs.publish != 'true'
        run: |
          echo "CREATIVE_ARTIFACT_UPLOADED=YES"
          echo "METRICOOL_UNATTENDED_PUBLICATION=DISABLED"
          echo "META_DIRECT_PUBLICATION=THREE_DAILY_MODES_TWO_NETWORKS_WITH_CATCHUP"
          echo "SOURCE_WEBSITE_APPS_MODIFIED=NO"
