name: Deploy TrustFolio Mongo price sync 20261025
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tf-price-sync-deploy-20261025.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify patch syntax on runner
        run: |
          set -euo pipefail
          python3 -m py_compile ops/trustfolio-price-sync/patch_backend.py
          node --check ops/trustfolio-price-sync/category_price_watcher.js
      - name: SSH authorized
        env:
          K: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          KH: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          H: ${{ secrets.TF_DEPLOY_HOST }}
          U: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test "$H" = '200.234.47.87'
          test "$U" = 'scraperuser'
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          test "$KH" = "$expected"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KH" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transfer verified helper code to TrustFolio VPS
        env:
          H: ${{ secrets.TF_DEPLOY_HOST }}
          U: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes ops/trustfolio-price-sync/patch_backend.py "$U@$H:tf-price-sync-patch-20261025.py"
          scp -o StrictHostKeyChecking=yes ops/trustfolio-price-sync/category_price_watcher.js "$U@$H:tf-price-watcher-20261025.js"
      - name: Backup, install, restart backend, verify change stream
        env:
          H: ${{ secrets.TF_DEPLOY_HOST }}
          U: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$U@$H" 'bash -s' > tf-deploy-result.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
          if ! command -v pm2 >/dev/null 2>&1 && test -f "$HOME/.nvm/nvm.sh"; then
            . "$HOME/.nvm/nvm.sh"
            nvm use default >/dev/null 2>&1 || true
          fi
          command -v node
          command -v pm2
          root="$HOME/apps/trustfolio/node-backend"
          cd "$root"
          mkdir -p scripts "$HOME/backups/trustfolio-price-sync"
          watcher="$root/scripts/trustfolio-category-price-watcher.js"
          if test -f "$watcher"; then cp -p "$watcher" "$HOME/backups/trustfolio-price-sync/watcher-preinstall-$(date -u +%Y%m%dT%H%M%SZ).js"; fi
          cp "$HOME/tf-price-watcher-20261025.js" "$watcher"
          node --check "$watcher"
          node - <<'JS'
          const assert=require('assert');
          const w=require('./scripts/trustfolio-category-price-watcher');
          assert.strictEqual(w.sourcePrice({operationType:'update',updateDescription:{updatedFields:{price_inr:1234}}}),1234);
          assert.strictEqual(w.sourcePrice({operationType:'update',updateDescription:{updatedFields:{price:'1250'}}}),'1250');
          assert.strictEqual(w.relevant({operationType:'update',updateDescription:{updatedFields:{'live.price_inr':1000}}}),true);
          assert.strictEqual(w.relevant({operationType:'update',updateDescription:{updatedFields:{image:'abc'}}}),false);
          console.log('WATCHER_UNIT_TESTS=PASS');
          JS
          python3 "$HOME/tf-price-sync-patch-20261025.py"
          echo 'RESTARTING_ONLY_BACKEND=YES'
          pm2 restart trustfolio-backend > /dev/null
          sleep 3
          pm2 jlist | python3 -c 'import json,sys; p={x["name"]:x.get("pm2_env",{}).get("status") for x in json.load(sys.stdin)}; print("BACKEND_STATE",p.get("trustfolio-backend")); sys.exit(0 if p.get("trustfolio-backend")=="online" else 2)'
          if pm2 describe trustfolio-price-watcher >/dev/null 2>&1; then
            pm2 restart trustfolio-price-watcher > /dev/null
          else
            pm2 start "$watcher" --name trustfolio-price-watcher --cwd "$root" > /dev/null
          fi
          sleep 50
          pm2 jlist | python3 -c 'import json,sys; p={x["name"]:x.get("pm2_env",{}).get("status") for x in json.load(sys.stdin)}; [print("PM2",n,p.get(n)) for n in ("trustfolio-backend","trustfolio-web","trustfolio-admin","trustfolio-price-watcher")]; sys.exit(0 if all(p.get(n)=="online" for n in ("trustfolio-backend","trustfolio-web","trustfolio-price-watcher")) else 2)'
          echo 'WATCHER_EVENTS:'
          pm2 logs trustfolio-price-watcher --nostream --lines 24 2>&1 | grep -E 'PRICE_SYNC_CONNECTED|CHANGE_STREAM_ACTIVE|CATEGORY_RANGE_FULL_REFRESH|CATEGORY_RANGE_REFRESH|ERROR|failed=' | tail -15 || true
          echo 'LOCAL_API_HEALTH:'
          curl --fail --silent --show-error --max-time 15 -o /dev/null -w 'CATEGORIES_HTTP=%{http_code}\n' http://127.0.0.1:8081/api/categories
          node - <<'JS'
          const fs=require('fs');
          const a=fs.readFileSync('services/LivePriceService.js','utf8');
          const b=fs.readFileSync('services/CategoryService.js','utf8');
          if(!a.includes('fields.price = String(price)')||!b.includes('let price = extractPriceFromString(p.price)')){
            console.log('PATCH_CONTRACT=FAIL');process.exit(4);
          }
          console.log('PATCH_CONTRACT=PASS');
          JS
          pm2 save > /dev/null
          echo 'AUTOMATIC_MONGO_PRICE_SYNC=INSTALLED'
          echo 'MARKETPLACE_API_CALLS_BY_WATCHER=NONE'
          echo 'USER_WORKFLOW_DEPLOYED=YES'
          REMOTE
      - name: Save installation report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f tf-deploy-result.txt || echo 'DEPLOYMENT_DID_NOT_REACH_REMOTE_STAGE' > tf-deploy-result.txt
          tail -100 tf-deploy-result.txt
          b="$(base64 -w0 tf-deploy-result.txt)"
          jq -n --arg message 'ops: temporary TrustFolio price sync deploy report' --arg content "$b" '{message:$message,content:$content}' >/tmp/status.json
          curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' --data-binary @/tmp/status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops-status/tf-price-deploy-20261025.txt" > /dev/null
