name: TrustFolio LinkedIn 3-mode independent same-day catch-up
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linkedin-daily-catchup.yml']
  schedule:
    # 21:00 and 22:30 IST, after Meta publication slots; recover only missing modes.
    - cron: '30 15 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: trustfolio-extended-social-one-at-a-time
  cancel-in-progress: false
jobs:
  catch-up:
    if: vars.TF_BUFFER_FREE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [budget, brand_budget, comparison]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_EVENT_NAME: workflow_run
      TF_BUFFER_FREE_PUBLISH_ENABLED: ${{ vars.TF_BUFFER_FREE_PUBLISH_ENABLED || 'false' }}
      TF_BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.TF_BUFFER_LINKEDIN_CHANNEL_ID || '6ae212582f1f5ed648fd63b5' }}
      TF_BUFFER_API_KEY: ${{ secrets.TF_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check existing LinkedIn reservation before media work
        id: missing
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from automation.linkedin_x_crosspost_v1 import get_ledger,LEDGER
          day=datetime.now(ZoneInfo('Asia/Kolkata')).date().isoformat()
          mode='${{ matrix.mode }}'
          item=get_ledger(os.environ['GITHUB_TOKEN'],LEDGER,
                          f'extra-social-ledger/{day}/linkedin-mode-{mode}.json')
          # Reserved/ambiguous and scheduled states MUST NOT be submitted again.
          if item is not None:
              print('LINKEDIN_ALREADY_RESERVED_OR_SCHEDULED='+str(item.get('status')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('proceed='+str(item is None).lower()+'\n')
          PY
      - name: Locate exact same-day published campaign and download original artifact
        if: steps.missing.outputs.proceed == 'true'
        run: python automation/linkedin_find_published_source_v1.py --mode ${{ matrix.mode }} --output source-social-ad
      - name: Install Pillow for isolated recovery
        if: steps.missing.outputs.proceed == 'true'
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Check source prices and choose fresh LinkedIn-only rebuild when stale
        id: freshness
        if: steps.missing.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import os
          from automation.linkedin_x_crosspost_v1 import validate_source,ExtraSocialBlocked
          try:
              validate_source('source-social-ad',gh_token=os.environ['GITHUB_TOKEN'],verify_live=True)
              drift=False
          except ExtraSocialBlocked as exc:
              if str(exc)!='Website rankings/prices changed; no crosspost':raise
              drift=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('rebuild='+str(drift).lower()+'\n')
              output.write('folder='+('linkedin-fresh-ad' if drift else 'source-social-ad')+'\n')
          print('LINKEDIN_PRICE_DRIFT='+str(drift))
          PY
      - name: Authenticate pinned ads-only VPS for fresh rebuild
        if: steps.freshness.outputs.rebuild == 'true'
        env:
          KEY: ${{ secrets.TF_DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.TF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "200.234.47.87" && "$USER" == "scraperuser" ]]
          expected='200.234.47.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMw5OgsY7J3PcG28EZ15uhvX3gwB2AC7YZ9NuvbGm0KC'
          [[ "$HOSTKEY" == "$expected" ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
      - name: Rebuild fresh verified LinkedIn creative
        if: steps.freshness.outputs.rebuild == 'true'
        env:
          HOST: ${{ secrets.TF_DEPLOY_HOST }}
          USER: ${{ secrets.TF_DEPLOY_USER }}
        run: |
          python -m automation.linkedin_fresh_recovery_v1 \
            --source source-social-ad --destination linkedin-fresh-ad \
            --run-key "${GITHUB_RUN_ID}${{ strategy.job-index }}" --host "$HOST" --user "$USER"
      - name: Schedule verified LinkedIn post through existing Buffer Free account
        if: steps.missing.outputs.proceed == 'true'
        run: |
          python automation/buffer_free_crosspost_v1.py \
            --network linkedin \
            --folder "${{ steps.freshness.outputs.folder }}" --live
      - name: Archive LinkedIn-only recovery evidence
        if: steps.freshness.outputs.rebuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trustfolio-linkedin-catchup-${{ matrix.mode }}-${{ github.run_id }}
          path: linkedin-fresh-ad/
          retention-days: 30
