name: TrustFolio ONE-TIME Buffer LinkedIn read-only connection check
on:
  push:
    branches: [fix/linkedin-company-captions-and-safe-dryrun-20261028]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TF_BUFFER_API_KEY: ${{ secrets.TF_BUFFER_API_KEY }}
      TF_BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.TF_BUFFER_LINKEDIN_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only verify pinned Buffer LinkedIn connection (zero posts)
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,sys
          from automation.buffer_free_crosspost_v1 import verify_buffer_channel
          expected="6ae212582f1f5ed648fd63b5"
          key=os.environ.get("TF_BUFFER_API_KEY") or ""
          channel=os.environ.get("TF_BUFFER_LINKEDIN_CHANNEL_ID") or ""
          if not key:
              print("BUFFER_LINKEDIN_READ_ONLY_CONFIG=BLOCKED_MISSING_GITHUB_SECRET")
              sys.exit(2)
          if channel and channel!=expected:
              print("BUFFER_LINKEDIN_READ_ONLY_CONFIG=BLOCKED_DIFFERENT_CHANNEL_VARIABLE")
              sys.exit(3)
          if not channel:
              print("BUFFER_LINKEDIN_GITHUB_VARIABLE=NOT_SET")
          confirmed=verify_buffer_channel(key,"linkedin",expected)
          if confirmed.get("name")!="trustfolio-in":
              print("BUFFER_LINKEDIN_READ_ONLY_CONFIG=BLOCKED_UNEXPECTED_CHANNEL_NAME")
              sys.exit(4)
          print("BUFFER_LINKEDIN_READ_ONLY_AUTH_AND_CHANNEL=PASS")
          print("BUFFER_LINKEDIN_CHANNEL_NAME="+str(confirmed["name"]))
          print("BUFFER_LINKEDIN_GRAPHQL_USED=ACCOUNT_AND_CHANNELS_READ_ONLY")
          print("BUFFER_POSTS_CREATED=0")
          PY
